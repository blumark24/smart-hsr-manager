<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART HSR — مركز إدارة المستخدمين V3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914}iframe{display:block;width:100%;height:100%;border:0;background:#050914}</style>
</head>
<body>
<iframe id="managerPreviewV3" title="SMART HSR Manager Preview V3" src="./manager.html?preview=phase11f-ordered"></iframe>
<script>
const frame=document.getElementById('managerPreviewV3');
const REV='phase11f-23-single-owner';
function activate(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.head)return;
    const files=[
      ['./manager-phase11c-user-center-core.js','ucInstitutionCoreLoader'],
      ['./manager-phase11c-user-center-dialogs.js','ucInstitutionDialogsLoader'],
      ['./manager-phase11c-user-center-import.js','ucInstitutionImportLoader'],
      ['./manager-phase11c-legacy-account-bridge.js','ucLegacyAccountBridgeLoader'],
      ['./manager-phase11d-user-center-enhancements.js','ucPhase11dEnhancementsLoader'],
      ['./manager-phase11f-reference-ui.js','ucPhase11fReferenceUiLoader'],
      ['./manager-phase11e-user-center-interactions.js','ucPhase11eInteractionsLoader']
    ];
    let index=0;
    const loadNext=()=>{
      if(index>=files.length)return;
      const [src,key]=files[index++];
      const attr=`data-${key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}`;
      if(doc.querySelector(`script[${attr}="true"]`)){loadNext();return;}
      const s=doc.createElement('script');
      s.src=`${src}?rev=${REV}`;
      s.async=false;
      s.setAttribute(attr,'true');
      s.onload=loadNext;
      s.onerror=()=>{console.error('SMART HSR preview failed to load',src);loadNext();};
      doc.head.appendChild(s);
    };
    loadNext();
  }catch(error){console.error('SMART HSR preview activation failed',error);}
}
frame.addEventListener('load',activate);
if(frame.contentDocument&&frame.contentDocument.readyState==='complete')activate();
</script>
</body>
</html>
