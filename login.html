<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart HSR - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #0ea5a1;
            --secondary-navy: #0b2b3a;
            --card-bg: #ffffff;
            --button-shadow: rgba(14, 165, 161, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(180deg, #f7f9fb 0%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 380px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(10,20,50,0.15);
            padding: 40px 30px;
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 18px 45px rgba(14,165,161,0.2); }
        .card-header-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-teal), var(--secondary-navy));
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }
        h1 { margin: 0 0 4px 0; text-align: center; font-size: 32px; color: var(--secondary-navy); font-weight: 900; }
        p.lead { margin: 0 0 25px 0; text-align: center; color: #6c757d; font-weight: 500; font-size: 16px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 8px; color: var(--secondary-navy); font-size: 14px; font-weight: 600; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #d4dce4;
            background: #f8f9fa;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(14,165,161,0.1);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--primary-teal), #0b7285);
            color: white;
            box-shadow: 0 10px 20px var(--button-shadow);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--button-shadow);
            background: linear-gradient(90deg, #0b7285, var(--primary-teal));
        }
        .message { text-align: center; margin-top: 15px; font-weight: 600; font-size: 15px; }
        .error { color: #dc3545; }
        .success { color: #198754; }
        .muted { font-size: 13px; color: #7b8a90; text-align: center; margin-top: 15px; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width:420px) { .card { width: 95%; padding: 30px 20px; } }
    </style>
</head>
<body>

<div class="card" role="main">
  <div class="card-header-line"></div>
  <h1>Smart HSR</h1>
  <p class="lead">تسجيل دخول الموظفين</p>

  <form id="loginForm">
    <div class="field">
      <label for="email">البريد الإلكتروني (المعتمد):</label>
      <input id="email" type="email" placeholder="example@smart-hsr.com" required />
    </div>
    <div class="field">
      <label for="password">كلمة المرور:</label>
      <input id="password" type="password" placeholder="كلمة المرور " required />
    </div>
    <button type="submit" id="loginButton" class="btn btn-primary" style="margin-top:10px;">
        تسجيل الدخول
    </button>
  </form>

  <div id="msg" class="message"></div>
  <div id="serviceSelector" style="display:none;margin-top:16px;"></div>
  <div class="muted">هذا النظام مخصص للمستخدمين المعتمدين والمصرح لهم فقط.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { resolveFirebaseConfig } from './firebase-runtime-config.js';

// إعدادات Firebase
const firebaseConfig = await resolveFirebaseConfig();

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const managerApp = initializeApp(firebaseConfig, 'smart-hsr-manager-session');
const managerAuth = getAuth(managerApp);
await setPersistence(managerAuth, browserLocalPersistence);
// The probe never persists credentials. It determines the authoritative role
// before either persistent Auth namespace is touched.
const probeApp = initializeApp(firebaseConfig, 'smart-hsr-role-probe');
const probeAuth = getAuth(probeApp);
const probeDb = getFirestore(probeApp);
await setPersistence(probeAuth, inMemoryPersistence);
const loginButton = document.getElementById('loginButton');
const msgBox = document.getElementById('msg');
const selectorBox = document.getElementById('serviceSelector');

// Lands is a separate product/origin (Smart HSR Lands) sharing this same
// Firebase project only on Preview (see firebase-runtime-config.js — Production
// resolves to the smart-hsr-manager project, which has no landsMunicipalities
// data, so this probe is naturally a no-op there). Revisit this constant once
// Lands has its own Production deployment.
const LANDS_APP_URL = 'https://lands-smart-git-staging-lands-trusted-audit-blumark24-os.vercel.app/';
const LANDS_ROLES = ['municipal_manager', 'lands_department_manager', 'lands_employee'];

function showMsg(text, type='') {
  msgBox.textContent = text;
  msgBox.className = 'message ' + type;
}

function resetButton() {
  loginButton.disabled = false;
  loginButton.textContent = 'تسجيل الدخول';
}

// organizationId (Field's tenant key) is used only as a fail-closed candidate
// for municipality_id (Lands' tenant key) — the two products have no declared
// mapping today. This lookup can never grant Lands access on its own: a real,
// enabled landsMunicipalities/{id}/userAccess/{uid} document — created only
// through Lands' own trusted entitlement admin flow — must already exist and
// match this exact uid. If the candidate id is wrong or no such document
// exists, this simply returns null and nothing changes for the user.
async function probeLandsEntitlement(uid, organizationIdCandidate) {
  if (!organizationIdCandidate) return null;
  try {
    const snap = await getDoc(doc(probeDb, 'landsMunicipalities', organizationIdCandidate, 'userAccess', uid));
    if (!snap.exists()) return null;
    const membership = snap.data() || {};
    const valid = membership.enabled === true
      && membership.firebase_uid === uid
      && membership.municipality_id === organizationIdCandidate
      && LANDS_ROLES.includes(membership.lands_role);
    return valid ? { municipalityId: organizationIdCandidate } : null;
  } catch {
    // Fail closed: any read error (including a permission denial for a
    // guessed id that isn't this user's own path) means "no Lands access",
    // never a crash of the existing Field login.
    return null;
  }
}

function goToLands(municipalityId) {
  const url = new URL(LANDS_APP_URL);
  // Non-secret tenant identifier only — no password, token, or other auth
  // material is ever placed in a URL.
  url.searchParams.set('municipality', municipalityId);
  window.location.href = url.toString();
}

async function goToField(email, password, fieldTarget) {
  if (fieldTarget.kind === 'supervisor' || fieldTarget.kind === 'manager') {
    await signInWithEmailAndPassword(managerAuth, email, password);
  } else {
    await signInWithEmailAndPassword(auth, email, password);
  }
  window.location.href = fieldTarget.page;
}

function renderSelector(email, password, fieldTarget, landsTarget) {
  showMsg('✅ تم التحقق بنجاح — اختر مساحة العمل', 'success');
  selectorBox.style.display = 'flex';
  selectorBox.style.gap = '10px';
  selectorBox.innerHTML = `
    <button type="button" id="goFieldBtn" class="btn btn-primary" style="flex:1;">النظام الميداني</button>
    <button type="button" id="goLandsBtn" class="btn btn-primary" style="flex:1;background:linear-gradient(90deg,#0b2b3a,#0ea5a1);">نظام الأراضي</button>
  `;
  document.getElementById('goFieldBtn').addEventListener('click', async () => {
    selectorBox.querySelectorAll('button').forEach(b => b.disabled = true);
    await goToField(email, password, fieldTarget);
  });
  document.getElementById('goLandsBtn').addEventListener('click', () => {
    selectorBox.querySelectorAll('button').forEach(b => b.disabled = true);
    goToLands(landsTarget.municipalityId);
  });
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    showMsg('الرجاء إدخال البريد وكلمة المرور.', 'error');
    return;
  }

  loginButton.disabled = true;
  loginButton.innerHTML = `<div class="loading-spinner"></div> جاري الدخول...`;
  selectorBox.style.display = 'none';
  selectorBox.innerHTML = '';

  try {
    const cred = await signInWithEmailAndPassword(probeAuth, email, password);
    const user = cred.user;
    // managers/{uid} is authoritative. A legacy users/{uid} record must never
    // override a valid organization manager and route them to the wrong page.
    // Fetched unconditionally (not just when active) so its organizationId can
    // still serve as a Lands lookup candidate even when the Field role itself
    // isn't valid — that candidate is fail-closed either way (see above).
    const managerSnap = await getDoc(doc(probeDb, "managers", user.uid));
    const manager = managerSnap.exists() ? (managerSnap.data() || {}) : null;
    const managerOrg = typeof manager?.organizationId === 'string' ? manager.organizationId.trim() : '';

    const userDoc = await getDoc(doc(probeDb, "users", user.uid));
    const data = userDoc.exists() ? (userDoc.data() || {}) : {};
    const role = data.role;
    const organizationId = typeof data.organizationId === 'string' ? data.organizationId.trim() : '';

    // Existing Field routing decision — unchanged from prior behavior.
    let fieldTarget = null;
    if (manager && manager.role === 'manager' && manager.active !== false && managerOrg) {
      fieldTarget = { kind: 'manager', page: 'manager.html' };
    } else if (userDoc.exists() && ['supervisor', 'inspector', 'contractor'].includes(role)
        && data.active !== false && organizationId) {
      fieldTarget = { kind: role, page: role === 'contractor' ? 'mobile-map.html' : role === 'supervisor' ? 'manager.html' : 'dashboard.html' };
    }

    const landsTarget = await probeLandsEntitlement(user.uid, managerOrg || organizationId);

    if (!fieldTarget && !landsTarget) {
      await signOut(probeAuth);
      showMsg('🚫 لا توجد صلاحية فعالة أو مؤسسة محددة لهذا المستخدم.', 'error');
      resetButton();
      return;
    }

    if (fieldTarget && landsTarget) {
      await signOut(probeAuth);
      resetButton();
      renderSelector(email, password, fieldTarget, landsTarget);
      return;
    }

    if (landsTarget) {
      showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه إلى نظام الأراضي', 'success');
      await signOut(probeAuth);
      setTimeout(() => goToLands(landsTarget.municipalityId), 1000);
      return;
    }

    // Field-only — identical to prior behavior.
    showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه', 'success');
    if (fieldTarget.kind === 'supervisor') {
      await signInWithEmailAndPassword(managerAuth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
    await signOut(probeAuth);
    setTimeout(() => { window.location.href = fieldTarget.page; }, 1000);

  } catch (e) {
    console.error(e);
    showMsg('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.', 'error');
    resetButton();
  }
});
</script>
</body>
</html>
