<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart HSR - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #0ea5a1;
            --secondary-navy: #0b2b3a;
            --card-bg: #ffffff;
            --button-shadow: rgba(14, 165, 161, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(180deg, #f7f9fb 0%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 380px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(10,20,50,0.15);
            padding: 40px 30px;
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 18px 45px rgba(14,165,161,0.2); }
        .card-header-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-teal), var(--secondary-navy));
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }
        h1 { margin: 0 0 4px 0; text-align: center; font-size: 32px; color: var(--secondary-navy); font-weight: 900; }
        p.lead { margin: 0 0 25px 0; text-align: center; color: #6c757d; font-weight: 500; font-size: 16px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 8px; color: var(--secondary-navy); font-size: 14px; font-weight: 600; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #d4dce4;
            background: #f8f9fa;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(14,165,161,0.1);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--primary-teal), #0b7285);
            color: white;
            box-shadow: 0 10px 20px var(--button-shadow);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--button-shadow);
            background: linear-gradient(90deg, #0b7285, var(--primary-teal));
        }
        .message { text-align: center; margin-top: 15px; font-weight: 600; font-size: 15px; }
        .error { color: #dc3545; }
        .success { color: #198754; }
        .muted { font-size: 13px; color: #7b8a90; text-align: center; margin-top: 15px; }
        .btn-choice { margin-bottom: 12px; }
        .btn-choice:last-child { margin-bottom: 0; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width:420px) { .card { width: 95%; padding: 30px 20px; } }
    </style>
</head>
<body>

<div class="card" id="loginCard" role="main">
  <div class="card-header-line"></div>
  <h1>Smart HSR</h1>
  <p class="lead">تسجيل الدخول إلى النظام الميداني</p>

  <form id="loginForm">
    <div class="field">
      <label for="email">البريد الإلكتروني (المعتمد):</label>
      <input id="email" type="email" placeholder="example@smart-hsr.com" required />
    </div>
    <div class="field">
      <label for="password">كلمة المرور:</label>
      <input id="password" type="password" placeholder="كلمة المرور " required />
    </div>
    <button type="submit" id="loginButton" class="btn btn-primary" style="margin-top:10px;">
        تسجيل الدخول
    </button>
  </form>

  <div id="msg" class="message"></div>
  <div class="muted">هذا النظام مخصص للمديرين والمراقبين والمقاولين وفرق حركة السير المعتمدين فقط.</div>
</div>

<!-- Product Chooser — an entitlement/router layer only, never a second
     authentication system. Shown after a single successful sign-in, ONLY
     when that account holds more than one authorized SMART HSR service, so
     the employee can pick which one to enter. Reuses the exact same card/
     button visual family as the login form above; hidden until populated. -->
<div class="card" id="chooserCard" role="main" style="display:none">
  <div class="card-header-line"></div>
  <h1 style="font-size:26px;">Smart HSR</h1>
  <p class="lead">اختر الخدمة التي تريد الدخول إليها</p>
  <div id="chooserOptions"></div>
  <div class="muted">تظهر هنا فقط الخدمات المصرح بها لحسابك.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence, browserLocalPersistence, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, connectFirestoreEmulator } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { resolveFirebaseConfig } from './firebase-runtime-config.js';

// إعدادات Firebase
const firebaseConfig = await resolveFirebaseConfig();

// Test-only: connects to the local Firebase emulators instead of production
// Firebase. Gated on localhost AND an explicit opt-in query param — never
// reachable in production, and inert for every real login.
const useEmulators = ['localhost', '127.0.0.1'].includes(location.hostname)
  && new URLSearchParams(location.search).get('useEmulators') === '1';

// Same hostname-based decision rule firebase-runtime-config.js already uses
// for this app's OWN identity: any hostname that isn't a recognized
// Preview/staging *.vercel.app host (a real Production/custom domain, for
// instance) is Production by default — never the reverse. The unified SSO
// redirect target must follow the SAME rule Lands' own client already uses
// to pick its Firebase project (lands-smart's index.html), or a Production
// employee gets handed off to a deployment running the wrong project
// entirely and the handoff code is meaningless there.
const LANDS_PRODUCTION_HOSTNAMES = Object.freeze(['smart-hsr-manager.vercel.app', 'smart-hsr-manager-blumark24-os.vercel.app']);
const LANDS_PRODUCTION_URL = 'https://lands-smart.vercel.app/';
const LANDS_STAGING_PREVIEW_URL = 'https://lands-smart-git-staging-lands-trusted-audit-blumark24-os.vercel.app/';
function resolveLandsRedirectBase() {
  const hostname = location.hostname;
  if (!hostname.endsWith('.vercel.app') || LANDS_PRODUCTION_HOSTNAMES.includes(hostname)) {
    return LANDS_PRODUCTION_URL;
  }
  return LANDS_STAGING_PREVIEW_URL;
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const managerApp = initializeApp(firebaseConfig, 'smart-hsr-manager-session');
const managerAuth = getAuth(managerApp);
await setPersistence(managerAuth, browserLocalPersistence);
// The probe never persists credentials. It determines the authoritative role
// before either persistent Auth namespace is touched.
const probeApp = initializeApp(firebaseConfig, 'smart-hsr-role-probe');
const probeAuth = getAuth(probeApp);
const probeDb = getFirestore(probeApp);
await setPersistence(probeAuth, inMemoryPersistence);
if (useEmulators) {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
  connectAuthEmulator(managerAuth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectAuthEmulator(probeAuth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(probeDb, '127.0.0.1', 8080);
}
const loginButton = document.getElementById('loginButton');
const msgBox = document.getElementById('msg');

function showMsg(text, type='') {
  msgBox.textContent = text;
  msgBox.className = 'message ' + type;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    showMsg('الرجاء إدخال البريد وكلمة المرور.', 'error');
    return;
  }

  loginButton.disabled = true;
  loginButton.innerHTML = `<div class="loading-spinner"></div> جاري الدخول...`;

  try {
    const cred = await signInWithEmailAndPassword(probeAuth, email, password);
    const user = cred.user;
    // managers/{uid} is authoritative. A legacy users/{uid} record must never
    // override a valid organization manager and route them to the wrong page.
    const managerSnap = await getDoc(doc(probeDb, "managers", user.uid));
    if (managerSnap.exists()) {
      const manager = managerSnap.data() || {};
      const managerOrg = typeof manager.organizationId === 'string' ? manager.organizationId.trim() : '';
      if (manager.role === 'manager' && manager.active !== false && managerOrg) {
        await signInWithEmailAndPassword(managerAuth, email, password);
        // smart-mobility.html/smart-mobility-adapter.js checks its own
        // named 'smart-hsr-mobility-session' app for a signed-in user —
        // without also signing into it here, a manager who later clicks
        // through to Smart Mobility from manager.html would find no
        // session there and get bounced back to this page.
        const managerMobilityApp = initializeApp(firebaseConfig, 'smart-hsr-mobility-session');
        const managerMobilityAuth = getAuth(managerMobilityApp);
        if (useEmulators) connectAuthEmulator(managerMobilityAuth, 'http://127.0.0.1:9099', { disableWarnings: true });
        await setPersistence(managerMobilityAuth, browserLocalPersistence);
        await signInWithEmailAndPassword(managerMobilityAuth, email, password);
        await signOut(probeAuth);
        window.location.href = 'manager.html';
        return;
      }
    }

    const MOBILITY_ROLES = ['mobility_head', 'department_head', 'administrative_affairs', 'employee'];
    const userDoc = await getDoc(doc(probeDb, "users", user.uid));
    const data = userDoc.exists() ? (userDoc.data() || {}) : {};
    const role = data.role;
    const organizationId = typeof data.organizationId === 'string' ? data.organizationId.trim() : '';
    const hasFieldRole = ['supervisor','inspector','contractor'].includes(role);
    // PHASE 02B/06C — unified entitlement contract: once mobilityAccess
    // exists on a record at all, it ALONE decides Mobility state — mirrors
    // firestore.rules' mobilityRoleValue() and platform/contracts/product-
    // entitlement-contract.js's resolveProductEntitlements() exactly. An
    // explicit mobilityAccess.enabled:false must never be reactivated by a
    // stale legacy `role` value, and a record whose Mobility role lives
    // ONLY in this independent field (role may be null, or even a Field
    // role like 'supervisor' — Field and Mobility are independent) must
    // still be recognized. Only a record never touched by the new field
    // still falls back to the legacy scalar `role`.
    const mobilityAccess = data.mobilityAccess;
    const mobilityRole = mobilityAccess !== undefined
      ? (mobilityAccess && mobilityAccess.enabled === true ? mobilityAccess.role : null)
      : role;
    const hasMobilityRole = MOBILITY_ROLES.includes(mobilityRole);
    const landsAccess = data.landsAccess;
    const hasLandsRole = Boolean(landsAccess && landsAccess.enabled
      && ['lands_employee','lands_department_manager'].includes(landsAccess.role));
    if (!userDoc.exists() || data.active === false || !organizationId || (!hasFieldRole && !hasMobilityRole && !hasLandsRole)) {
      await signOut(probeAuth);
      showMsg('🚫 لا توجد صلاحية فعالة أو مؤسسة محددة لهذا المستخدم.', 'error');
      loginButton.disabled = false;
      loginButton.textContent = 'تسجيل الدخول';
      return;
    }

    // One operational employee = one operational service (server-enforced).
    // A Lands employee/department-manager is routed to the Lands trusted
    // runtime via a one-time server-side SSO handoff (POST /api/organization/context
    // -> Lands' /api/lands-sso-register), so they land on the Lands dashboard
    // directly instead of seeing a second login screen. Only an opaque,
    // single-use, short-lived handoff code crosses the redirect URL — never
    // a password, ID token, or custom token. Lands independently re-verifies
    // the entitlement at consumption time before minting any session.
    // Field and Smart Mobility roles take priority: a record with an active
    // Field or Mobility role is never routed to Lands, even if it also
    // carries a landsAccess declaration.
    if (hasLandsRole && !hasFieldRole && !hasMobilityRole) {
      let handoffCode = null;
      try {
        const idToken = await user.getIdToken();
        const handoffResp = await fetch('/api/organization/context', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
        });
        const handoffData = await handoffResp.json().catch(() => ({}));
        if (handoffResp.ok && typeof handoffData.code === 'string' && handoffData.code) {
          handoffCode = handoffData.code;
        }
      } catch (e) {
        console.error('lands-sso-handoff request failed', e);
      }
      await signOut(probeAuth);

      if (!handoffCode) {
        showMsg('❌ تعذر إعداد الدخول الآمن إلى حصر منح الأراضي الذكي. حاول لاحقًا.', 'error');
        loginButton.disabled = false;
        loginButton.textContent = 'تسجيل الدخول';
        return;
      }

      showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه إلى حصر منح الأراضي الذكي', 'success');
      setTimeout(() => {
        const landsUrl = new URL(resolveLandsRedirectBase());
        landsUrl.searchParams.set('code', handoffCode);
        window.location.href = landsUrl.toString();
      }, 600);
      return;
    }

    // Routes to exactly one already-determined product. Used both for the
    // auto-direct single-service case below AND for whichever option the
    // Product Chooser's user picks — the SAME session/redirect logic either
    // way, never a second/duplicate authentication. Preserves the existing
    // authenticated Firebase identity/session for same-project products
    // (Manager/Field/Mobility all share this one Firebase project).
    async function performFieldRouting() {
      showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه', 'success');
      if (role === 'supervisor') {
        await signInWithEmailAndPassword(managerAuth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      await signOut(probeAuth);
      setTimeout(() => {
        if (role === 'contractor') {
          window.location.href = 'mobile-map.html';
        } else if (role === 'supervisor') {
          window.location.href = 'manager.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 1000);
    }

    async function performMobilityRouting() {
      showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه', 'success');
      const mobilityApp = initializeApp(firebaseConfig, 'smart-hsr-mobility-session');
      const mobilityAuth = getAuth(mobilityApp);
      if (useEmulators) connectAuthEmulator(mobilityAuth, 'http://127.0.0.1:9099', { disableWarnings: true });
      await setPersistence(mobilityAuth, browserLocalPersistence);
      await signInWithEmailAndPassword(mobilityAuth, email, password);
      await signOut(probeAuth);
      setTimeout(() => { window.location.href = 'smart-mobility.html'; }, 1000);
    }

    // The SAME trusted, single-use Lands SSO handoff as the auto-route
    // branch above — invoked from the Product Chooser instead of
    // automatically, for an account that ALSO holds Field and/or Mobility
    // access. Never a second credential, never a shared Firebase project/
    // session with Lands, never a stronger or weaker handoff than the
    // solo-Lands path already uses.
    async function performLandsRouting() {
      let handoffCode = null;
      try {
        const idToken = await user.getIdToken();
        const handoffResp = await fetch('/api/organization/context', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
        });
        const handoffData = await handoffResp.json().catch(() => ({}));
        if (handoffResp.ok && typeof handoffData.code === 'string' && handoffData.code) {
          handoffCode = handoffData.code;
        }
      } catch (e) {
        console.error('lands-sso-handoff request failed', e);
      }
      await signOut(probeAuth);
      if (!handoffCode) {
        showMsg('❌ تعذر إعداد الدخول الآمن إلى حصر منح الأراضي الذكي. حاول لاحقًا.', 'error');
        return;
      }
      showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه إلى حصر منح الأراضي الذكي', 'success');
      setTimeout(() => {
        const landsUrl = new URL(resolveLandsRedirectBase());
        landsUrl.searchParams.set('code', handoffCode);
        window.location.href = landsUrl.toString();
      }, 600);
    }

    const enabledServiceCount = (hasFieldRole ? 1 : 0) + (hasMobilityRole ? 1 : 0) + (hasLandsRole ? 1 : 0);

    // Product Chooser — an entitlement/router layer only, never a second
    // authentication system, never a role chooser. Shown ONLY when this
    // already-authenticated account holds more than one authorized SMART
    // HSR product; each option simply invokes the exact same routing a
    // single-service account would already get automatically above.
    if (enabledServiceCount > 1) {
      const loginCard = document.getElementById('loginCard');
      const chooserCard = document.getElementById('chooserCard');
      const chooserOptions = document.getElementById('chooserOptions');
      const options = [];
      if (hasFieldRole) options.push({ label: 'إدارة الحصر الميداني', run: performFieldRouting });
      if (hasMobilityRole) options.push({ label: 'إدارة الحركة والسير', run: performMobilityRouting });
      if (hasLandsRole) options.push({ label: 'إدارة الأراضي والممتلكات', run: performLandsRouting });
      chooserOptions.innerHTML = '';
      for (const opt of options) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-primary btn-choice';
        btn.textContent = opt.label;
        btn.addEventListener('click', () => {
          for (const other of chooserOptions.querySelectorAll('button')) other.disabled = true;
          opt.run();
        });
        chooserOptions.appendChild(btn);
      }
      loginCard.style.display = 'none';
      chooserCard.style.display = 'block';
      loginButton.disabled = false;
      loginButton.textContent = 'تسجيل الدخول';
      return;
    }

    if (hasFieldRole) {
      await performFieldRouting();
    } else {
      await performMobilityRouting();
    }

  } catch (e) {
    console.error(e);
    showMsg('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.', 'error');
    loginButton.disabled = false;
    loginButton.textContent = 'تسجيل الدخول';
  }
});
</script>
</body>
</html>
