<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart HSR - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #0ea5a1;
            --secondary-navy: #0b2b3a;
            --card-bg: #ffffff;
            --button-shadow: rgba(14, 165, 161, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(180deg, #f7f9fb 0%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 380px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(10,20,50,0.15);
            padding: 40px 30px;
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 18px 45px rgba(14,165,161,0.2); }
        .card-header-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-teal), var(--secondary-navy));
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }
        h1 { margin: 0 0 4px 0; text-align: center; font-size: 32px; color: var(--secondary-navy); font-weight: 900; }
        p.lead { margin: 0 0 25px 0; text-align: center; color: #6c757d; font-weight: 500; font-size: 16px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 8px; color: var(--secondary-navy); font-size: 14px; font-weight: 600; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #d4dce4;
            background: #f8f9fa;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(14,165,161,0.1);
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--primary-teal), #0b7285);
            color: white;
            box-shadow: 0 10px 20px var(--button-shadow);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--button-shadow);
            background: linear-gradient(90deg, #0b7285, var(--primary-teal));
        }
        .message { text-align: center; margin-top: 15px; font-weight: 600; font-size: 15px; }
        .error { color: #dc3545; }
        .success { color: #198754; }
        .muted { font-size: 13px; color: #7b8a90; text-align: center; margin-top: 15px; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width:420px) { .card { width: 95%; padding: 30px 20px; } }
    </style>
</head>
<body>

<div class="card" role="main">
  <div class="card-header-line"></div>
  <h1>Smart HSR</h1>
  <p class="lead">تسجيل الدخول إلى النظام الميداني</p>

  <form id="loginForm">
    <div class="field">
      <label for="email">البريد الإلكتروني (المعتمد):</label>
      <input id="email" type="email" placeholder="example@smart-hsr.com" required />
    </div>
    <div class="field">
      <label for="password">كلمة المرور:</label>
      <input id="password" type="password" placeholder="كلمة المرور " required />
    </div>
    <button type="submit" id="loginButton" class="btn btn-primary" style="margin-top:10px;">
        تسجيل الدخول
    </button>
  </form>

  <div id="msg" class="message"></div>
  <div class="muted">هذا النظام مخصص للمديرين والمراقبين والمقاولين المعتمدين فقط.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// إعدادات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCXCiNeaO9lhM79tKb98x4oaNqNy5xKvWM",
  authDomain: "smart-hsr-manager.firebaseapp.com",
  projectId: "smart-hsr-manager",
  storageBucket: "smart-hsr-manager.firebasestorage.app",
  messagingSenderId: "38965508031",
  appId: "1:38965508031:web:6fd0b6c6b0b63fa513930a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const loginButton = document.getElementById('loginButton');
const msgBox = document.getElementById('msg');

function showMsg(text, type='') {
  msgBox.textContent = text;
  msgBox.className = 'message ' + type;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    showMsg('الرجاء إدخال البريد وكلمة المرور.', 'error');
    return;
  }

  loginButton.disabled = true;
  loginButton.innerHTML = `<div class="loading-spinner"></div> جاري الدخول...`;

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const user = cred.user;
    // managers/{uid} is authoritative. A legacy users/{uid} record must never
    // override a valid organization manager and route them to the wrong page.
    const managerSnap = await getDoc(doc(db, "managers", user.uid));
    if (managerSnap.exists()) {
      const manager = managerSnap.data() || {};
      const managerOrg = typeof manager.organizationId === 'string' ? manager.organizationId.trim() : '';
      if (manager.role === 'manager' && manager.active !== false && managerOrg) {
        window.location.href = 'manager.html';
        return;
      }
    }

    const userDoc = await getDoc(doc(db, "users", user.uid));
    const data = userDoc.exists() ? (userDoc.data() || {}) : {};
    const role = data.role;
    const organizationId = typeof data.organizationId === 'string' ? data.organizationId.trim() : '';
    if (!userDoc.exists() || !['supervisor','inspector','contractor'].includes(role)
        || data.active === false || !organizationId) {
      await signOut(auth);
      showMsg('🚫 لا توجد صلاحية فعالة أو مؤسسة محددة لهذا المستخدم.', 'error');
      loginButton.disabled = false;
      loginButton.textContent = 'تسجيل الدخول';
      return;
    }

    showMsg('✅ تم التحقق بنجاح... جارٍ التوجيه', 'success');

    setTimeout(() => {
      if (role === 'contractor') {
        window.location.href = 'mobile-map.html';
      } else if (role === 'supervisor') {
        window.location.href = 'manager.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }, 1000);

  } catch (e) {
    console.error(e);
    showMsg('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.', 'error');
    loginButton.disabled = false;
    loginButton.textContent = 'تسجيل الدخول';
  }
});
</script>
</body>
</html>
