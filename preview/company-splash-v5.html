<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART HSR — Company Splash V5 Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#03110d;--bg2:#061a13;--ink:#f4f7f5;--muted:#90a69a;--accent:#70e39a;--line:rgba(112,227,154,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Cairo",system-ui,sans-serif}
.splash{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:
radial-gradient(circle at 50% 43%,rgba(34,126,79,.11) 0%,rgba(6,26,19,.045) 28%,transparent 58%),
linear-gradient(180deg,var(--bg2) 0%,var(--bg) 58%,#020b08 100%);color:var(--ink)}
.splash:before{content:"";position:absolute;inset:0;background:
linear-gradient(180deg,rgba(255,255,255,.012),transparent 34%),
radial-gradient(circle at 50% 43%,rgba(112,227,154,.045),transparent 30%)}
.core{position:relative;z-index:1;width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-1.5vh)}
.brand{display:flex;align-items:center;justify-content:center;gap:18px;direction:ltr;animation:brand .34s cubic-bezier(.16,.84,.3,1) .04s both}
.mark{width:88px;height:97px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.28))}
.word{display:flex;flex-direction:column;align-items:flex-start;min-width:250px;color:#f7faf8;text-shadow:0 8px 22px rgba(0,0,0,.22)}
.smart{font-family:Arial,Helvetica,sans-serif;font-size:30px;line-height:.94;font-weight:700;letter-spacing:.23em;margin-left:.18em;white-space:nowrap}
.hsr{margin-top:7px;font-family:Arial,Helvetica,sans-serif;font-size:64px;line-height:.76;font-weight:800;letter-spacing:-.045em;transform:scaleX(1.04);transform-origin:left center;white-space:nowrap}
.tag{margin-top:21px;color:var(--muted);font:500 8.5px/1.45 "IBM Plex Mono","Courier New",monospace;letter-spacing:.16em;text-transform:uppercase;direction:ltr;opacity:0;animation:fade .22s ease .28s forwards}
.line{position:relative;display:block;width:168px;height:1px;margin-top:18px;overflow:hidden;background:var(--line);opacity:0;animation:fade .18s ease .36s forwards}
.line:after{content:"";position:absolute;top:0;left:-52%;width:52%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 10px rgba(112,227,154,.15);animation:pass .42s cubic-bezier(.4,0,.2,1) .43s both}
.status{margin-top:13px;display:flex;align-items:center;gap:8px;color:var(--muted);font:500 10px/1.5 "Cairo",system-ui,sans-serif;opacity:0;animation:fade .20s ease .53s forwards}
.status i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(112,227,154,.34)}
@keyframes brand{from{opacity:0;transform:translateY(5px) scale(.987);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}@keyframes pass{from{transform:translateX(0)}to{transform:translateX(300%)}}
@media(max-width:620px){.brand{gap:12px}.mark{width:68px;height:75px}.word{min-width:195px}.smart{font-size:23px;letter-spacing:.21em}.hsr{font-size:49px;margin-top:6px}.tag{font-size:7px;letter-spacing:.12em;margin-top:18px}.status{font-size:9px}}
</style>
</head>
<body>
<div class="splash">
  <div class="core">
    <div class="brand">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 84" fill="none" role="img" aria-label="SMART HSR">
  <path d="M38 4a30 30 0 1 0 0 60 30 30 0 0 0 0-60z" fill="none" stroke="#ffffff" stroke-width="7"/>
  <rect x="26" y="30" width="7.5" height="22" rx="1.5" fill="#ffffff"/>
  <rect x="35.5" y="20" width="7.5" height="32" rx="1.5" fill="#ffffff"/>
  <rect x="45" y="26" width="7.5" height="26" rx="1.5" fill="#ffffff"/>
  <path d="M12 46 38 80 64 46 51 46 38 63 25 46z" fill="#ffffff"/>
</svg>
      <div class="word"><span class="smart">SMART</span><span class="hsr">HSR</span></div>
    </div>
    <span class="tag">SAUDI MUNICIPAL INTELLIGENCE SYSTEM</span>
    <span class="line"></span>
    <div class="status"><i></i><span>تهيئة بيئة SMART HSR الآمنة</span></div>
  </div>
</div>
</body>
</html>
