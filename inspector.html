<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#06192e" />
    <title>SMART HSR — المراقب الميداني</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="inspector/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">انتقل للمحتوى</a>
    <div class="app">
      <header>
        <div class="identity">
          <img src="Smart_HSR_Dashboard_Logo.svg" alt="SMART HSR" />
          <div>
            <h1 id="greeting">مساحة المراقب</h1>
            <p>المراقب الميداني</p>
          </div>
        </div>
        <button
          id="notifications"
          disabled
          title="الإشعارات غير مدعومة حالياً"
          aria-label="الإشعارات غير متاحة"
        >
          ♧
        </button>
      </header>
      <p class="tagline">معاً.. لبيئة حضرية أكثر أماناً وجودة</p>
      <div id="notice" role="status" aria-live="polite">
        جارٍ التحقق من الجلسة…
      </div>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav aria-label="التنقل الرئيسي" id="nav">
      <a href="#home" data-route="home"><span>⌂</span>الرئيسية</a
      ><a href="#tasks" data-route="tasks"><span>▤</span>مهامي</a
      ><a class="capture-nav" href="#new" data-route="new"
        ><span>＋</span>بلاغ جديد</a
      ><a href="#statistics" data-route="statistics"><span>▥</span>الإحصائيات</a
      ><a href="#account" data-route="account"><span>♙</span>الحساب</a>
    </nav>
    <dialog id="case-sheet" aria-labelledby="case-title">
      <div class="sheet-head">
        <h2 id="case-title">تفاصيل الحالة</h2>
        <button id="close-sheet" aria-label="إغلاق التفاصيل">×</button>
      </div>
      <div id="case-content"></div>
    </dialog>
    <script type="module" src="inspector/app.mjs"></script>
  </body>
</html>
