<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المدير - Smart HSR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at center, #0EA5A1 0%, #0B2B3A 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 30px rgba(14,165,161,0.4);
      text-align: center;
      animation: fadeIn 1.2s ease-out;
    }
    .glow { animation: glowPulse 3s ease-in-out infinite; }

    @keyframes glowPulse {
      0%,100%{ box-shadow:0 0 25px rgba(14,165,161,0.5); }
      50%{ box-shadow:0 0 45px rgba(14,165,161,0.9); }
    }
    @keyframes fadeIn {
      from{ opacity:0; transform:translateY(20px); }
      to{ opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card glow">
    <img src="Smart_HSR_Dashboard_Logo.svg" class="mx-auto w-24 mb-5 animate-pulse">
    <h2 class="text-2xl font-extrabold mb-6 text-teal-300 tracking-wide">
      تسجيل دخول المدير
    </h2>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-right mb-1">البريد الإلكتروني</label>
        <input type="email" id="email"
          class="w-full p-3 rounded-xl bg-white/10 border border-white/30 text-white placeholder-white/70 focus:ring-2 focus:ring-teal-400"
          placeholder="example@email.com" required>
      </div>
      <div>
        <label class="block text-right mb-1">كلمة المرور</label>
        <input type="password" id="password"
          class="w-full p-3 rounded-xl bg-white/10 border border-white/30 text-white placeholder-white/70 focus:ring-2 focus:ring-teal-400"
          placeholder="••••••••" required>
      </div>

      <button type="submit"
        class="w-full py-3 rounded-full bg-gradient-to-r from-teal-500 to-cyan-600 hover:opacity-90 font-extrabold tracking-wide transition">
        تسجيل الدخول
      </button>
    </form>

    <p id="errorMsg" class="text-red-400 mt-4 hidden text-sm"></p>

    <p class="mt-6 text-white/60 text-xs">© 2025 Smart HSR — جميع الحقوق محفوظة</p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { resolveFirebaseConfig } from './firebase-runtime-config.js';
import { classifyManagerLoginError } from './manager-login-error-classification.js';

const errorMsg = document.getElementById("errorMsg");
const submitBtn = document.querySelector('#loginForm button[type="submit"]');
function showLoginMessage(text) {
  errorMsg.textContent = text;
  errorMsg.classList.remove("hidden");
}

// إعدادات Firebase — a failure here is a system/environment problem (wrong
// project, Preview config unavailable), never a credentials problem, so it
// must never be allowed to silently leave the form non-functional.
let firebaseConfig;
try {
  firebaseConfig = await resolveFirebaseConfig();
} catch (configErr) {
  console.error('manager-login: Firebase configuration unavailable', configErr);
  showLoginMessage('⚠️ تعذر تحميل إعدادات النظام. حاول لاحقًا أو تواصل مع الدعم الفني.');
  if (submitBtn) submitBtn.disabled = true;
  throw configErr;
}

// Dedicated persisted Auth namespace: manager/supervisor actions must never
// mutate the field-worker session stored by the default Firebase app.
const app = initializeApp(firebaseConfig, 'smart-hsr-manager-session');
const auth = getAuth(app);
await setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.classList.add("hidden");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  // Step 1: Firebase Auth itself. Kept in its own try/catch so a failure
  // here can never be confused with what happens after — a wrong password
  // and a Firestore permission/network failure are different problems with
  // different fixes, and telling the user to "check your password" for the
  // second one is actively misleading.
  let user;
  try {
    const userCred = await signInWithEmailAndPassword(auth, email, password);
    user = userCred.user;
  } catch (authErr) {
    console.error('manager-login: authentication failed', authErr);
    const kind = classifyManagerLoginError(authErr);
    showLoginMessage(kind === 'credential-failed'
      ? "❌ فشل تسجيل الدخول — تحقق من البريد أو كلمة المرور"
      : "⚠️ تعذر الاتصال بخدمة المصادقة حاليًا. حاول لاحقًا أو تواصل مع الدعم الفني.");
    return;
  }

  // Step 2: manager/supervisor authorization lookup. Authentication already
  // succeeded at this point — any failure here is a lookup/authorization
  // problem, never a credentials problem.
  try {
    // 🔍 تحقق إذا كان موجود داخل managers
    const ref = doc(db, "managers", user.uid);
    const snap = await getDoc(ref);

    const managerData = snap.exists() ? snap.data() : null;

    // لا تُنشئ صلاحية من صفحة الدخول. المدير من managers/{uid} أو المشرف
    // المساعد من users/{uid} فقط، وكلاهما فعّال ومرتبط بمؤسسة.
    const managerOrg = typeof managerData?.organizationId === 'string' ? managerData.organizationId.trim() : '';
    let authorized = !!(managerData && managerData.role === 'manager' && managerData.active !== false && managerOrg);
    if (!authorized) {
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const userData = userSnap.exists() ? (userSnap.data() || {}) : {};
      const userOrg = typeof userData.organizationId === 'string' ? userData.organizationId.trim() : '';
      authorized = userData.role === 'supervisor' && userData.active !== false && !!userOrg;
    }
    if (!authorized) {
      await signOut(auth);
      showLoginMessage("❌ هذا الحساب غير مصرح له بالدخول كمدير");
      return;
    }

    // تخزين الجلسة بعد التحقق من مستند المدير ودوره فقط
    sessionStorage.setItem("smartHSRUser", JSON.stringify({
      uid: user.uid,
      email: user.email,
      role: "manager"
    }));

    window.location.href = "manager.html";

  } catch (lookupErr) {
    // Authenticated successfully but the manager-authorization lookup
    // itself failed (Firestore permission-denied, network error, rules
    // misconfiguration). This is never the password's fault, and the user
    // must not be left signed in with an unverified authorization state.
    console.error('manager-login: manager authorization lookup failed', lookupErr);
    await signOut(auth).catch(() => {});
    showLoginMessage("⚠️ تعذر التحقق من صلاحياتك حاليًا. حاول لاحقًا أو تواصل مع الدعم الفني.");
  }
});
</script>

</body>
</html>
