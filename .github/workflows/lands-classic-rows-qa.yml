name: Lands Classic Row Register QA
on:
  push:
    branches:
      - fix/lands-classic-row-register-20261016
  workflow_dispatch:
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Classic rows and existing Lands regressions
        run: |
          node --test test/lands-classic-row-register.test.js test/lands-premium-registry-ui.test.js test/lands-production-mobile-regression.test.js test/lands-safe-draft-discard.test.js test/lands-grant-number.test.js test/phase19-2-lands-role-matrix.test.js
