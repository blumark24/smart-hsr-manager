name: Lands Row R3 Mobile Stability
on:
  push:
    branches:
      - fix/lands-one-row-smooth-scroll-20261016
  workflow_dispatch:
jobs:
  lands-register-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: One-row UX and authorization regressions
        run: |
          node --test test/lands-previous-row-restore.test.js test/lands-grant-number.test.js test/lands-safe-draft-discard.test.js test/phase19-2-lands-role-matrix.test.js
