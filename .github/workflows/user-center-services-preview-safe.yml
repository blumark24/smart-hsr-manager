name: Safe User Center + Services Preview Gate

on:
  push:
    branches:
      - plan/user-center-services-preserve-ui-20261027
      - fix/preview-workforce-tab-isolation-20261028
      - fix/preview-weather-header-only-20261028
      - fix/preview-municipality-identity-display-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Preserve approved User Center and services behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check service-switcher.js
          node --check workspace-access.js
          node --check manager-phase11c-user-center-core.js
          node --check manager-phase11c-user-center-dialogs.js
          node --check manager-phase11d-user-center-enhancements.js
          node --check manager-phase11f-reference-ui.js
          node --check manager-phase11g-user-center-approved-skin.js
          node --check mobility-runtime.js
          node --check field-head-runtime.js
          node --check api/organization/context.js
          node --check platform/weather/met-public-forecast.js
          node --check smart-hsr-weather.js
          node --input-type=module --check < manager-dashboard-adapter.js
          node --input-type=module --check < lands/client/lands-client.js
      # lands-shell-ui.test.js is a legacy snapshot test (six old titles/UI
      # shapes already fail on the unchanged custom-domain baseline SHA).
      # The new focused Lands suite verifies current header preservation and
      # authorized same-origin navigation without relaxing application code.
      - name: Existing regressions + targeted Lands and identity guard
        run: |
          node --test \
            test/user-center-services-preserve-current-contract.test.js \
            test/user-center-edit-window-layout.test.js \
            test/user-center-compact-grid-email-performance.test.js \
            test/user-center-redesign-v2.test.js \
            test/unified-identity-service-switcher.test.js \
            test/mobility-role-runtime.test.js \
            test/lands-services-header-routing.test.js \
            test/embedded-lands-preview.test.js \
            test/municipal-weather-zero-cost-preview.test.js \
            test/preview-lands-sso-gate.test.js \
            test/preview-login-account-reason.test.js \
            test/preview-workforce-tab-isolation.test.js \
            test/preview-municipality-identity-display.test.js
