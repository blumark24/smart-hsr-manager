name: Lands Review Splash Contract Fix

on:
  push:
    branches:
      - release/municipality-final-v5
    paths:
      - .github/workflows/fix-lands-review-splash.yml

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[lands-splash-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/municipality-final-v5
          fetch-depth: 0

      - name: Restore approved SMART HSR company splash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lands/review-direct.html")
          text = path.read_text(encoding="utf-8")

          boot = text.index("async function boot()")
          start = text.index("  if (reviewRequested) {", boot)
          end = text.index('  await withBootTimeout(loadModules(), "modules");', start)

          replacement = '''  if (reviewRequested) {
            // Preserve the approved SMART HSR Company Splash throughout Review boot.
            window.SmartHSRCompanySplash?.show();
            document.body.classList.add("secure-handoff-active");
            try {
              await withBootTimeout(loadModules(), "review-modules");
              enterReviewMode();
            } catch (error) {
              console.error("[LANDS_REVIEW_BOOT]", error && error.message ? error.message : "unknown");
              showDenied(
                "تعذر تحميل نسخة المراجعة في الوقت المحدد. أعد فتح الصفحة.",
                { returnToUnified: false }
              );
            }
            return;
          }
          '''

          patched = text[:start] + replacement + text[end:]

          if "reviewLoader.style.cssText" in patched or 'id="landsReviewLoader"' in patched:
              raise SystemExit("white review loader still present")
          if 'window.SmartHSRCompanySplash?.show();' not in patched:
              raise SystemExit("approved splash call missing")

          path.write_text(patched, encoding="utf-8")
          PY

      - name: Add regression contract test
        run: |
          cat > test/lands-review-splash-contract.test.js <<'EOF'
          const fs = require('node:fs');
          const test = require('node:test');
          const assert = require('node:assert/strict');

          test('Review Mode preserves approved SMART HSR company splash', () => {
            const html = fs.readFileSync('lands/review-direct.html', 'utf8');
            const bootStart = html.indexOf('async function boot()');
            assert.notEqual(bootStart, -1);
            const boot = html.slice(bootStart);

            assert.match(boot, /window\.SmartHSRCompanySplash\?\.show\(\)/);
            assert.match(boot, /await withBootTimeout\(loadModules\(\), "review-modules"\)/);
            assert.match(boot, /enterReviewMode\(\)/);
            assert.doesNotMatch(boot, /landsReviewLoader/);
            assert.doesNotMatch(boot, /reviewLoader\.style\.cssText/);
          });
          EOF

      - name: Verify regression contract
        run: node --test test/lands-review-splash-contract.test.js

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lands/review-direct.html test/lands-review-splash-contract.test.js
          git rm .github/workflows/fix-lands-review-splash.yml
          git commit -m "fix(lands): restore approved review splash [lands-splash-fix]"
          git push origin HEAD:release/municipality-final-v5
