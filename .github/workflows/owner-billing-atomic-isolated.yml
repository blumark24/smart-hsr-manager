name: SMART HSR Owner billing upgrade — isolated atomic regression
on:
  push:
    branches:
      - fix/owner-upgrade-ledger-no-deploy-20261101
  pull_request:
    branches:
      - fix/lands-staging-no-orphan-metadata-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      B2_APPLICATION_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No Production or Preview deployment, limited review scope
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const current=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          assert.equal(current.git?.deploymentEnabled?.['fix/owner-upgrade-ledger-no-deploy-20261101'],false);
          NODE
          git diff --name-only a1fbda58932d9d6568faa0c2e876e6630aed4108 HEAD > /tmp/owner-review-changes
          if grep -Ev '^(api/_lib/ownerBillingUpgrade\.js|api/_lib/ownerManualBilling\.js|api/_lib/ownerOpsSupport\.js|owner-organizations\.js|owner-invoices\.js|test/owner-billing-upgrade-atomic\.test\.cjs|test/owner-manual-billing-pending\.test\.cjs|test/owner-invoice-lifecycle-atomic\.test\.cjs|api/_lib/embeddedLandsRuntime\.js|embedded-lands/server/lands-mutation-executor\.js|test/lands-approval-preview-evidence-gate\.test\.cjs|lands/index\.html|test/lands-national-id-display-privacy\.test\.cjs|firestore\.rules|test/firestore\.rules\.test\.js|\.github/workflows/owner-billing-atomic-isolated\.yml)$' /tmp/owner-review-changes; then
            echo 'FAIL: out-of-scope path modification'; exit 1
          fi
          test -z "$FIREBASE_SERVICE_ACCOUNT"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$B2_APPLICATION_KEY"
          test -z "$OPENAI_API_KEY"
      - name: Syntax and source/transaction tests — synthetic only
        run: |
          node --check api/_lib/ownerBillingUpgrade.js
          node --check api/_lib/ownerManualBilling.js
          node --check api/_lib/ownerOpsSupport.js
          node --check test/owner-billing-upgrade-atomic.test.cjs
          node --check test/owner-manual-billing-pending.test.cjs
          node --check test/owner-invoice-lifecycle-atomic.test.cjs
          node --test test/owner-billing-upgrade-atomic.test.cjs test/owner-manual-billing-pending.test.cjs test/owner-invoice-lifecycle-atomic.test.cjs test/owner-operations-closure.test.js
      - name: Hold release
        run: |
          echo 'CI SUCCESS IS NOT MUNICIPAL UAT. Draft only, NO DEPLOY OR MERGE.'
          echo 'Owner billing is a pending draft, not paid and not a tax invoice.'

  firestore-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      FIREBASE_SERVICE_ACCOUNT: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      B2_APPLICATION_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Local emulator only, no deployed Firebase access
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          assert.equal(cfg.git.deploymentEnabled['fix/owner-upgrade-ledger-no-deploy-20261101'],false);
          const runner=fs.readFileSync('test/run-firestore-rules.js','utf8');
          assert.match(runner,/demo-smart-hsr-tests/);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:rules
      - name: Seven-tenant isolation in fresh synthetic Firestore Emulator
        run: npx --no-install firebase emulators:exec --project demo-smart-hsr-tests --only firestore "node --test test/phase25-multi-org-isolation.test.js"

  one-sha-platform-contracts:
    name: One-SHA cross-product P0/P1 contract regression (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      FIREBASE_SERVICE_ACCOUNT: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      B2_APPLICATION_KEY: ''
      OPENAI_API_KEY: ''
      FIREBASE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm branch cannot auto-deploy and no cloud credentials are used
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const cfg = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          assert.equal(cfg.git?.deploymentEnabled?.['fix/owner-upgrade-ledger-no-deploy-20261101'],false);
          NODE
          test -z "$FIREBASE_SERVICE_ACCOUNT"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$B2_APPLICATION_KEY"
          test -z "$OPENAI_API_KEY"
          test -z "$FIREBASE_TOKEN"
      - name: Locked dependency install, no deployment or cloud calls
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Zero-cost production dependency vulnerability audit (npm registry, no cloud credentials)
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('npm', ['audit', '--omit=dev', '--json'], {
            encoding: 'utf8',
            maxBuffer: 12 * 1024 * 1024,
            timeout: 120000,
            env: { ...process.env, FIREBASE_SERVICE_ACCOUNT: '', GOOGLE_APPLICATION_CREDENTIALS: '', B2_APPLICATION_KEY: '', OPENAI_API_KEY: '', FIREBASE_TOKEN: '' }
          });
          let audit;
          try { audit = JSON.parse(result.stdout || ''); }
          catch (_) { console.error('AUDIT_INCONCLUSIVE: npm did not return valid JSON'); process.exit(1); }
          if (result.error || audit.error || !audit.metadata?.vulnerabilities || result.status === null) {
            console.error('AUDIT_INCONCLUSIVE: dependency registry audit was not completed');
            process.exit(1);
          }
          const counts = audit.metadata.vulnerabilities;
          console.log('PRODUCTION_DEPENDENCY_AUDIT:', JSON.stringify({
            critical: counts.critical || 0, high: counts.high || 0,
            moderate: counts.moderate || 0, low: counts.low || 0,
            info: counts.info || 0, total: counts.total || 0
          }));
          for (const [name, record] of Object.entries(audit.vulnerabilities || {})) {
            if (['critical', 'high', 'moderate'].includes(record.severity)) {
              // Names and severities only; never emit credentials or source contents.
              console.log('PRODUCTION_REVIEW_REQUIRED:', JSON.stringify({
                package: name, severity: record.severity,
                direct: Boolean(record.isDirect),
                fixAvailable: Boolean(record.fixAvailable)
              }));
            }
          }
          if ((counts.critical || 0) + (counts.high || 0) > 0) process.exit(1);
          NODE
      - name: Preview Firebase B2 tenant authentication document boundaries
        run: |
          node --test \
            test/preview-isolation-guard.test.cjs \
            test/preview-isolation-module-contract.test.cjs \
            test/preview-firebase-isolation-http.test.cjs \
            test/lands-client-app-isolation.test.cjs \
            test/lands-preview-document-no-orphan.test.cjs \
            test/lands-approval-preview-evidence-gate.test.cjs \
            test/lands-national-id-display-privacy.test.cjs
      - name: Core sessions Manager identity Mobility Field and Lands
        run: |
          node --test \
            test/portal-session-isolation.test.js \
            test/manager-lands-sso.test.js \
            test/manager-login-preview-config.test.js \
            test/manager-users-list-state.test.js \
            test/identity-display-sync-regression.test.js \
            test/manager-mobility-adapter.test.js \
            test/lands-bootstrap.test.js \
            test/field-command-center-honest-kpis.test.cjs \
            test/lands-document-feedback-preview.test.cjs
      - name: Integrated municipality release and visual data contracts
        run: |
          node --test \
            test/preview-workforce-tab-isolation.test.js \
            test/preview-lands-sso-gate.test.js \
            test/preview-municipality-identity-display.test.js \
            test/municipal-weather-zero-cost-preview.test.js \
            test/user-center-directory-response-order.test.js \
            test/manager-lands-completeness-parity.test.cjs \
            test/manager-lands-digital-record.test.js \
            test/manager-lands-gis.test.js \
            test/municipal-release-gate.test.cjs \
            test/preview-same-origin-api-contract.test.cjs \
            test/lands-executive-header-profile-ai.test.cjs \
            test/preview-lands-sso-live-preflight.test.cjs
      - name: Release decision is always review-only NO-GO without human signoffs
        run: |
          node scripts/municipal-release-gate.cjs --report-only
          echo 'Green code tests are not protected municipal UAT or production release approval.'

  one-sha-chromium-local:
    name: One-SHA local real Chromium light dark desktop iPad mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      FIREBASE_SERVICE_ACCOUNT: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      B2_APPLICATION_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against any deployment or real backend input
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const cfg = require('./vercel.json');
          assert.equal(cfg.git?.deploymentEnabled?.['fix/owner-upgrade-ledger-no-deploy-20261101'],false);
          NODE
          test -z "$FIREBASE_SERVICE_ACCOUNT"
          test -z "$B2_APPLICATION_KEY"
      - name: Install isolated Playwright Chromium fixture-only tools
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Synthetic localhost-only Lands header profile day night responsive UAT
        run: node --test test/lands-browser-visual-acceptance.e2e.cjs
      - name: Store synthetic screenshots for reviewer, never municipal data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-hsr-one-sha-draft-local-ui
          path: test-artifacts/lands-browser/
          retention-days: 7
          if-no-files-found: ignore
