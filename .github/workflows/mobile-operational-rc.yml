name: SMART HSR Operational Mobile RC

on:
  workflow_dispatch:
    inputs:
      staging_api_origin:
        description: 'Approved non-Production HTTPS Staging API origin'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-origin:
    name: Validate Staging origin
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.validate.outputs.origin }}
    steps:
      - name: Validate explicit non-Production HTTPS origin
        id: validate
        shell: bash
        env:
          ORIGIN: ${{ inputs.staging_api_origin }}
        run: |
          node <<'NODE'
          const raw = String(process.env.ORIGIN || '').trim();
          if (!raw) throw new Error('staging_api_origin is required');
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('staging_api_origin must be an HTTPS origin only');
          }
          const forbidden = new Set([
            'smart-hsr-manager.vercel.app',
            'smart-hsr-manager-blumark24-os.vercel.app'
          ]);
          if (forbidden.has(url.hostname)) throw new Error('Production origin is forbidden');
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'origin=' + url.origin + '\n');
          NODE

  contract:
    name: Operational contract
    needs: validate-origin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Build operational packaged web runtime
        env:
          SMART_HSR_MOBILE_API_ORIGIN: ${{ needs.validate-origin.outputs.origin }}
        run: npm run bundle:web
      - run: npm test
      - name: Assert build is operational, not fail-closed
        shell: bash
        run: |
          grep -q "location.replace('login.html')" www/index.html
          grep -q '"mode":"native"' www/mobile-runtime-env.js
          grep -q '"apiOrigin":"https://' www/mobile-runtime-env.js

  android:
    name: Android operational APK
    needs: [validate-origin, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - name: Build operational packaged web runtime
        env:
          SMART_HSR_MOBILE_API_ORIGIN: ${{ needs.validate-origin.outputs.origin }}
        run: npm run bundle:web
      - run: npx cap add android
      - run: npm run native:permissions
      - run: npx cap sync android
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-hsr-operational-rc-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS operational simulator build
    needs: [validate-origin, contract]
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Build operational packaged web runtime
        env:
          SMART_HSR_MOBILE_API_ORIGIN: ${{ needs.validate-origin.outputs.origin }}
        run: npm run bundle:web
      - run: npx cap add ios
      - run: npm run native:permissions
      - run: npx cap sync ios
      - run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
