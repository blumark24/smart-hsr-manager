name: Lands Rules Gate

on:
  push:
    branches:
      - design/lands-system-polish-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lands-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firestore + Storage rules regression
        run: |
          npx firebase emulators:exec \
            --only firestore,storage \
            --project demo-smart-hsr-lands-candidate \
            "node --test test/firestore.rules.test.js test/lands-rules-candidate.test.js"

      - name: Lands application regression
        run: npm run test:lands
