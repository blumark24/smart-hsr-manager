name: RC2 Lockfile Refresh

permissions:
  contents: write

on:
  push:
    branches:
      - security/rc2-firebase-admin-14
  workflow_dispatch:

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore(security): refresh package-lock')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Apply safe production transitive dependency fixes
        run: npm audit fix --package-lock-only --omit=dev || true

      - name: Verify install and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "SMART HSR Security Bot"
            git config user.email "security-bot@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(security): refresh package-lock for firebase-admin 14.5.0"
            git push origin HEAD:security/rc2-firebase-admin-14
          fi

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rc2-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
        if: always()
