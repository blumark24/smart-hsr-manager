name: Field Visual QA

on:
  push:
    branches:
      - fix/field-visual-unification-v1
  workflow_dispatch:

jobs:
  field-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Visual contract
        run: node --test test/field-visual-unification.test.js

      - name: Field head regression
        run: |
          node --test test/field-head-operational-map.test.js
          node --test test/field-head-evidence-access.test.js
          node --test test/field-head-mobility-integration.test.js
          node --test test/field-head-user-center-provisioning.test.js

      - name: Field role and inspector regression
        run: |
          node --test test/phase19-2-field-role-matrix.test.js
          node --test test/phase19-3-inspector-record.test.js
          node --test test/inspector-acceptance-golden-observation.test.js
          node --test test/inspector-closure-regression.test.js
