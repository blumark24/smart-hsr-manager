name: SMART HSR Lands Assistant — Truthful Alerts and Scoped Read-only QA
on:
  push:
    branches:
      - fix/lands-assistant-honest-attention-20261031
  pull_request:
    branches:
      - release-candidate/option-b-one-sha-preview-20261031
permissions:
  contents: read
jobs:
  assistant-maintenance-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block Production, Firebase, API and branded shell mutations
        shell: bash
        run: |
          git diff --name-only 900ad89bf45ac29a6f4a240df7b64c1685415cc4 HEAD > /tmp/assistant-change-scope.txt
          cat /tmp/assistant-change-scope.txt
          if grep -Ev '^(lands/index\.html|test/lands-assistant-honest-attention\.test\.cjs|test/lands-browser-visual-acceptance\.e2e\.cjs|\.github/workflows/lands-assistant-honest-attention\.yml)$' /tmp/assistant-change-scope.txt; then
            echo 'BLOCK: unexpected file change'; exit 1
          fi
          git diff --unified=0 900ad89bf45ac29a6f4a240df7b64c1685415cc4 HEAD -- lands/index.html > /tmp/assistant-only.diff
          if grep -E '^[+-][^+-]' /tmp/assistant-only.diff | grep -E 'class="shell"|firebase|LANDS_EMBEDDED_RUNTIME|/api/|smart-hsr-mark|documentStorage' ; then
            echo 'BLOCK: visual shell, API, Auth or storage mutation'; exit 1
          fi
      - name: Confirm frozen header/sidebar markup byte-for-byte, apart from right-side labels
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const original = cp.execFileSync('git', ['show', '900ad89bf45ac29a6f4a240df7b64c1685415cc4:lands/index.html'], {encoding:'utf8'});
          const current = fs.readFileSync('lands/index.html', 'utf8');
          function section(source, from, until) {
            const a=source.indexOf(from),b=source.indexOf(until,a);
            assert.ok(a>=0 && b>a,'Missing approved shell anchor: '+from);
            return source.slice(a,b+until.length);
          }
          const headerStart='<header class="hsr-manager-header lands-manager-source-header';
          const originalHeader=section(original,headerStart,'</header>');
          const expectedHeader=originalHeader
            .replace('فتح القائمة الجانبية اليسرى','فتح القائمة الجانبية اليمنى')
            .replace('id="mobileNavToggle" class="lands-mobile-nav-toggle" type="button" aria-label="فتح القائمة الجانبية اليمنى" aria-controls="landsSidebar" aria-expanded="false" onclick="toggleSidebar()"><i data-lucide="panel-left"></i>',
              'id="mobileNavToggle" class="lands-mobile-nav-toggle" type="button" aria-label="فتح القائمة الجانبية اليمنى" aria-controls="landsSidebar" aria-expanded="false" onclick="toggleSidebar()"><i data-lucide="panel-right"></i>');
          assert.equal(section(current,headerStart,'</header>'),expectedHeader,'Header and logo must be unchanged');
          const sideStart='<aside class="side" id="landsSidebar"';
          const originalSide=section(original,sideStart,'</aside>');
          const expectedSide=originalSide
            .replace('القائمة الجانبية اليسرى لإدارة الأراضي','القائمة الجانبية اليمنى لإدارة الأراضي')
            .replace('فتح أو طي القائمة الجانبية اليسرى','فتح أو طي القائمة الجانبية اليمنى');
          assert.equal(section(current,sideStart,'</aside>'),expectedSide,'Approved sidebar must be unchanged');
          console.log('PASS: exact frozen header/sidebar markup except approved right-label fixes');
          NODE
      - name: Assistant real-function fixture tests and established Lands regression contracts
        run: |
          node --test \
            test/lands-assistant-honest-attention.test.cjs \
            test/lands-executive-header-profile-ai.test.cjs \
            test/manager-lands-completeness-parity.test.cjs \
            test/manager-lands-gis.test.js \
            test/lands-document-feedback-preview.test.cjs \
            test/preview-lands-sso-gate.test.js
      - name: Hold all merge/deployment authorization
        run: |
          echo 'Passing synthetic tests != real municipal consent, credentialed UAT, AI service integration or Production acceptance.'
          echo 'The official municipal data and Production deployment are strictly OUT OF SCOPE.'
          echo 'Lands right sidebar parity is a separate acceptance blocker; do not merge or publish.'


  browser-visual-safe:
    name: Synthetic Chromium RTL desktop/iPad/mobile + assistant regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: assistant-maintenance-synthetic
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright for local fixture runner only
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Real Chromium — local synthetic fixtures, no hosted municipality
        env:
          CI: 'true'
          FIREBASE_SERVICE_ACCOUNT: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: node --test test/lands-browser-visual-acceptance.e2e.cjs
      - name: Upload synthetic browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lands-assistant-right-sidebar-synthetic-review
          path: test-artifacts/lands-browser/
          if-no-files-found: ignore
          retention-days: 7
