name: PHASE14A Smart Lands Acceptance Gate

on:
  push:
    branches:
      - phase14a-smart-lands-v1-foundation
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check Lands integration
        run: |
          node --check manager-lands-adapter.js
          node --check api/_lib/landsBridge.js
          node --check api/_lib/landsManagerBootstrap.js
          node --check api/_lib/landsSyncReconciliation.js
          node --check api/admin/users.js

      - name: Lands bootstrap tests
        run: node --test test/lands-bootstrap.test.js

      - name: Lands bridge tests
        run: node --test test/lands-bridge.test.js

      - name: Lands manager auto-bootstrap tests
        run: node --test test/lands-manager-auto-bootstrap.test.js

      - name: Lands sync reconciliation tests
        run: node --test test/lands-sync-reconciliation.test.js

      - name: Manager Lands bridge integration tests
        run: node --test test/manager-lands-bridge-integration.test.js

      - name: Manager Lands SSO tests
        run: node --test test/manager-lands-sso.test.js

      - name: Service entitlement regression
        run: node --test test/manager-service-entitlements.test.js

      - name: Field Survey closure regression
        run: |
          node --test test/visual-distortion-lifecycle.integration.test.js
          node --test test/field-head-operational-map.test.js
          node --test test/field-head-user-center-provisioning.test.js

      - name: Firestore security rules regression
        run: npm run test:rules
