<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الخريطة التشغيلية · SMART HSR</title>
<!-- PHASE 08.3 — MapLibre GL is served locally (vendor/maplibre-gl/4.7.1/,
     the exact npm-pinned build previously loaded from unpkg.com) so browser
     acceptance and Preview/Production never depend on an external CDN. -->
<link rel="stylesheet" href="vendor/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="vendor/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="geo-core.bundle.js"></script>
<style>
  /* SMART HSR Hybrid Municipal GIS — calm, light-first operational chrome.
     The map remains a real MapLibre GIS surface; branding is intentionally
     restrained so streets, labels, municipal geometry and status data stay
     visually dominant. Night remains available for control-room use. */
  :root{
    color-scheme:light;
    --app-bg:#f3f6f4; --surface:#ffffff; --text:#13231c; --text-2:#40554b; --text-muted:#64766d;
    --border:#cfdad4; --border-subtle:#e5ebe7;
    --panel:#ffffff; --panel-border:#d7e1db; --pop:#ffffff; --pop-border:#d7e1db;
    --accent:#0f7a50; --accent-2:#095f3d;
    --green:#0f7a50; --green-hover:#095f3d; --green-soft:#e7f4ed;
    --warning:#a86406; --warning-soft:#fff4dc;
    --danger:#bd342d; --danger-2:#a82e28; --danger-soft:#fdecea;
    --btn:#0f7a50; --btn-border:#0f7a50;
    --status-pending:#ef4444; --status-progress:#f5a524; --status-done:#22c55e; --status-neutral:#64748b;
    --page-bg:#f3f6f4; --control-shadow:0 2px 10px rgba(23,45,34,.12);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --app-bg:#0f1824; --surface:#172231; --text:#edf3f0; --text-2:#b4c2ba; --text-muted:#8fa097;
    --border:#344456; --border-subtle:#263545;
    --panel:#172231; --panel-border:#334356; --pop:#172231; --pop-border:#334356;
    --accent:#5fd09a; --accent-2:#8ce3b6;
    --green:#39b77b; --green-hover:#62c995; --green-soft:#193e31;
    --warning:#e5a43d; --warning-soft:#3b3021;
    --danger:#f1746d; --danger-2:#fa918b; --danger-soft:#432825;
    --btn:#16865a; --btn-border:#25976b;
    --page-bg:#0f1824; --control-shadow:0 3px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%;background:var(--app-bg);color:var(--text);
    font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif}
  #authLoading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--page-bg);color:var(--text);z-index:100}
  #appShell.hidden,#authLoading.hidden{display:none}
  #appShell{display:flex;flex-direction:column;height:100vh;background:var(--page-bg)}
  header{display:flex;align-items:center;gap:.65rem;padding:.65rem .9rem;flex-wrap:wrap;flex:none;
    background:var(--panel);border-bottom:1px solid var(--panel-border);box-shadow:0 1px 4px rgba(23,45,34,.08);z-index:30}
  .product-title{display:flex;flex-direction:column;min-width:150px;line-height:1.25}
  .product-title strong{font-size:14px;color:var(--text)}
  .product-title span{font-size:10.5px;color:var(--text-muted)}
  header .spacer{flex:1;min-width:0}
  .search-shell{position:relative;flex:1;max-width:420px;min-width:220px}
  #searchInput{width:100%;height:38px;padding:0 .85rem;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;outline:none}
  #searchInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  #searchResults{position:absolute;top:calc(100% + 6px);right:0;left:0;display:none;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--control-shadow);padding:5px;z-index:60}
  #searchResults.open{display:block}
  .search-result{display:block;width:100%;border:0;background:transparent;color:var(--text);padding:.6rem .7rem;border-radius:7px;text-align:right;font:inherit;font-size:12px;cursor:pointer}
  .search-result:hover,.search-result:focus{background:var(--green-soft);outline:none}
  .search-empty{padding:.65rem;color:var(--text-muted);font-size:12px}
  button.geo-btn{min-height:36px;padding:.45rem .75rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-weight:600;font-size:12px;cursor:pointer}
  button.geo-btn:hover{color:var(--text);border-color:var(--green)}
  button.geo-btn.primary{background:var(--btn);border-color:var(--btn-border);color:#fff}
  .segmented{display:flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:9px;background:var(--app-bg)}
  .segment{height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--text-muted);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
  .segment.active{background:var(--surface);color:var(--green);box-shadow:0 1px 4px rgba(23,45,34,.12)}
  main{flex:1;min-height:0;position:relative;display:flex;overflow:hidden;background:var(--app-bg)}
  #map{flex:1;min-width:0;background:#dfe7e2}
  .maplibregl-ctrl-top-left{top:12px !important;left:12px !important;display:flex;flex-direction:column;gap:7px}
  .maplibregl-ctrl-group{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:9px !important;overflow:hidden;box-shadow:var(--control-shadow) !important}
  .maplibregl-ctrl-group button{width:36px !important;height:34px !important;background:transparent !important}
  .maplibregl-ctrl-group button + button{border-top:1px solid var(--border-subtle) !important}
  .maplibregl-ctrl-icon{filter:var(--ctrl-icon-filter,none)}
  html[data-theme="dark"] .maplibregl-ctrl-icon{filter:invert(1) brightness(1.6)}
  .maplibregl-ctrl button:not(:disabled):hover{background:var(--green-soft) !important}
  .maplibregl-ctrl-attrib{background:var(--surface) !important;color:var(--text-muted) !important;border-radius:7px !important}
  .maplibregl-ctrl-attrib a{color:var(--text-2) !important}
  .maplibregl-ctrl-fullscreen,.maplibregl-ctrl-geolocate{color:var(--text-2)}
  #rightPanel{position:absolute;top:12px;right:12px;z-index:10;width:252px;max-width:calc(100% - 24px)}
  #rightPanelToggle{display:inline-flex}
  #rightPanel.collapsed #layerPanel{display:none}
  #layerPanel{background:var(--pop);border:1px solid var(--pop-border);color:var(--text);
    border-radius:10px;padding:.75rem;box-shadow:var(--control-shadow);max-height:calc(100vh - 112px);overflow:auto}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-bottom:.6rem;border-bottom:1px solid var(--border-subtle)}
  #layerPanel h2{font-size:12.5px;margin:0;color:var(--text);font-weight:800}
  .clear-filters{border:0;background:transparent;color:var(--green);font:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
  .layer-row{display:flex;align-items:center;gap:.55rem;padding:.4rem .3rem;border-radius:9px;font-size:12px;color:var(--text-2)}
  .layer-row:hover{background:var(--green-soft)}
  .layer-row input{width:15px;height:15px;accent-color:var(--accent)}
  .layer-row .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .panel-section-title{font-size:11px;font-weight:700;color:var(--text);margin:.7rem .2rem .4rem;padding-top:.5rem;border-top:1px solid var(--border-subtle)}
  #filterChips{display:flex;flex-direction:column;gap:.3rem}
  .status-row{display:flex;align-items:center;gap:.5rem;padding:.4rem .3rem;border-radius:9px;font-size:12px;color:var(--text-2);cursor:pointer;border:1px solid transparent;background:transparent;width:100%;text-align:right;font:inherit}
  .status-row:hover{background:var(--green-soft)}
  .status-row.active{background:var(--green-soft);border-color:#a7ceb8;color:var(--text)}
  .status-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .status-row .count{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .geo-filter-select{width:100%;margin-top:.4rem;height:32px;padding:0 .5rem;border:1px solid var(--border);border-radius:8px;
    background:var(--app-bg);color:var(--text);font:inherit;font-size:12px}
  @media(max-width:900px){
    #rightPanel:not(.expanded) #layerPanel{display:none}
  }
  #entityCard{position:absolute;bottom:0;right:0;left:0;z-index:20;background:var(--pop);color:var(--text);border-top:1px solid var(--pop-border);
    border-radius:12px 12px 0 0;padding:1rem;transform:translateY(100%);transition:transform .2s ease;max-height:60vh;overflow:auto;box-shadow:0 -8px 24px rgba(23,45,34,.14)}
  #entityCard.open{transform:translateY(0)}
  @media(min-width:1024px){
    #entityCard{right:0;left:auto;bottom:0;top:0;width:360px;max-width:90vw;border-radius:0;border-top:0;border-right:1px solid var(--pop-border);
      transform:translateX(100%);max-height:none}
    #entityCard.open{transform:translateX(0)}
  }
  #entityCard h2{font-size:16px;margin:0 0 .3rem;color:var(--text)}
  #entityCard .meta{font-size:12px;color:var(--text-2);margin-bottom:.2rem}
  #entityCard .field{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
  #entityCard .field .label{color:var(--text-2)}
  #entityCard .empty-state{color:var(--text-muted)}
  #entityCardClose{position:absolute;top:.7rem;left:.7rem;min-width:34px;min-height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  #mapSummary{position:absolute;bottom:12px;right:12px;z-index:8;display:flex;align-items:center;gap:8px;padding:.4rem .65rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:var(--control-shadow);font-size:10.5px;color:var(--text-muted)}
  #mapSummary strong{color:var(--text);font-variant-numeric:tabular-nums}
  #attributionNote{position:absolute;bottom:12px;left:56px;z-index:5;font-size:10px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);
    padding:.2rem .45rem;border-radius:6px}
  .layer-count{margin-inline-start:auto;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  /* Quick popup — a small, premium light card floating over the dark map
     (matches the reference exactly: the popup stays light/white even in
     Night mode for maximum contrast against satellite imagery, only the
     surrounding chrome switches theme). Never the full detail panel. */
  .maplibregl-popup{max-width:280px !important;z-index:15}
  .maplibregl-popup-content{background:#ffffff;color:#0b1a15;border:1px solid rgba(15,23,42,.08);
    border-radius:10px;padding:0;box-shadow:0 12px 30px rgba(15,35,25,.24);font-family:inherit;overflow:hidden}
  .maplibregl-popup-tip{border-top-color:#ffffff !important;border-bottom-color:#ffffff !important}
  .maplibregl-popup-close-button{font-size:16px;color:#586b61;top:6px;inset-inline-end:8px}
  .geo-popup{display:flex;flex-direction:column}
  .geo-popup .popup-body{display:flex;gap:.6rem;padding:.75rem .8rem .5rem}
  .geo-popup .popup-thumb{width:52px;height:52px;flex:none;border-radius:10px;background:#eef2ef center/cover no-repeat;overflow:hidden}
  .geo-popup .popup-main{flex:1;min-width:0}
  .geo-popup h3{font-size:13px;font-weight:700;margin:0 0 .25rem;color:#0b1a15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .geo-popup .popup-sub{font-size:10.5px;color:#586b61;margin-bottom:.4rem}
  .geo-popup .status-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:10.5px;font-weight:700;
    padding:.15rem .5rem;border-radius:999px}
  .geo-popup .status-badge .dot{width:7px;height:7px;border-radius:50%}
  .geo-popup .row{display:flex;justify-content:space-between;gap:.5rem;font-size:11px;padding:.12rem 0;color:#586b61}
  .geo-popup .row b{color:#0b1a15;font-weight:600}
  .geo-popup .rows{padding:0 .8rem .5rem}
  .geo-popup .actions{display:flex;gap:.4rem;padding:0 .8rem .75rem}
  .geo-popup .actions .btn-details{flex:1;min-height:32px;border-radius:9px;font-size:11.5px;font-weight:700;cursor:pointer;
    background:var(--green,#12855a);border:1px solid var(--green,#12855a);color:#fff;display:flex;align-items:center;justify-content:center;gap:.35rem}
  .geo-popup .actions .btn-twin{flex:none;width:34px;min-height:32px;border-radius:9px;cursor:pointer;
    background:#eef2ef;border:1px solid rgba(15,23,42,.1);color:#3f5249;display:flex;align-items:center;justify-content:center}
  #entityCard .evidence-thumb{width:100%;height:110px;border-radius:8px;background:var(--app-bg) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;margin:.3rem 0;overflow:hidden}
  #entityCard .ai-block{margin-top:.5rem;padding:.5rem;border-radius:10px;background:var(--green-soft);
    border:1px solid var(--border);font-size:12px;line-height:1.6}
  /* Premium status-aware observation markers (DOM, not GL circles — see
     Section-14 note in the script: real MapLibre clustering data still
     drives every marker, only the RENDERING is DOM so a real numeric
     cluster count and a teardrop pin shape are possible without adding an
     external glyphs/font-server dependency). */
  .geo-marker{width:30px;height:38px;cursor:pointer}
  .geo-marker svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .geo-marker.selected{outline:3px solid #fff;outline-offset:2px;border-radius:50%}
  .geo-cluster{width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid #fff;
    box-shadow:0 3px 9px rgba(0,0,0,.28)}
  .geo-legend{display:flex;flex-direction:column;gap:.35rem}
  .geo-legend .row{display:flex;align-items:center;gap:.5rem;font-size:11px;color:var(--text-2)}
  .geo-legend .dot{width:8px;height:8px;border-radius:50%;flex:none}
  @media(max-width:760px){
    header{padding:.55rem .65rem;gap:.5rem}
    .product-title{min-width:auto}
    .product-title span{display:none}
    .search-shell{order:3;min-width:100%;max-width:none}
    .segmented{margin-inline-start:auto}
    #rightPanel{top:auto;right:8px;left:8px;bottom:8px;width:auto;max-width:none}
    #layerPanel{max-height:58vh;border-radius:12px}
    #mapSummary{right:8px;bottom:8px}
    #rightPanel.expanded ~ #mapSummary{display:none}
    #attributionNote{display:none}
    .hide-mobile{display:none}
  }
</style>
</head>
<body>
  <div id="authLoading"><div>...جارٍ التحقق</div></div>
  <div id="appShell" class="hidden">
    <header>
      <div class="product-title">
        <strong>الخريطة التشغيلية</strong>
        <span>SMART HSR · مركز العمليات البلدية</span>
      </div>
      <div class="search-shell">
        <input id="searchInput" type="search" autocomplete="off" placeholder="ابحث برقم البلاغ أو المنشأة أو المبنى…" aria-label="بحث" aria-controls="searchResults" aria-expanded="false">
        <div id="searchResults" role="listbox" aria-label="نتائج البحث"></div>
      </div>
      <div class="spacer"></div>
      <div class="segmented" id="basemapControl" role="group" aria-label="نوع الخريطة">
        <button class="segment active" type="button" data-basemap="street" aria-pressed="true">الشوارع</button>
        <button class="segment" type="button" data-basemap="satellite" aria-pressed="false">الأقمار</button>
      </div>
      <button class="geo-btn" id="rightPanelToggle" aria-label="إظهار أو إخفاء الطبقات والتصفية" aria-expanded="false">الطبقات والفلاتر</button>
      <button class="geo-btn" id="themeToggleBtn" aria-label="تفعيل الوضع الليلي">الوضع الليلي</button>
      <button class="geo-btn" id="openTwinBtn" hidden>التوأم الرقمي</button>
      <button class="geo-btn hide-mobile" id="logoutBtn">تسجيل الخروج</button>
    </header>
    <main>
      <div id="map" role="application" aria-label="الخريطة التشغيلية"></div>
      <div id="rightPanel">
        <div id="layerPanel">
          <div class="panel-head">
            <h2>الطبقات والفلاتر</h2>
            <button class="clear-filters" id="clearFiltersBtn" type="button">مسح الفلاتر</button>
          </div>
          <div class="panel-section-title">البيانات المعروضة</div>
          <div id="layerList"></div>
          <div class="panel-section-title">حالة البلاغات</div>
          <div id="filterChips"></div>
        </div>
      </div>
      <div id="mapSummary" aria-live="polite">
        <span>المعروض <strong id="visibleEntityCount">0</strong></span>
        <span>·</span>
        <span id="snapshotState">بيانات عند الطلب</span>
      </div>
      <div id="attributionNote"></div>
      <aside id="entityCard" aria-hidden="true">
        <button id="entityCardClose" aria-label="إغلاق">✕</button>
        <div id="entityCardBody"></div>
      </aside>
    </main>
  </div>

<script type="module">
import { initializeApp } from "./vendor/firebase/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, connectAuthEmulator } from "./vendor/firebase/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, connectFirestoreEmulator } from "./vendor/firebase/11.0.0/firebase-firestore.js";
import { resolveFirebaseConfig } from './firebase-runtime-config.js';
import { observationCoordinates } from './spatial-map.js';
import { resolveObservationImage } from './storage-adapter.js';

const { layerRegistry, styleTokens, continuity, search: searchModule, attribution: attributionModule, policy } = window.SmartHSRGeoCore;

const firebaseConfig = await resolveFirebaseConfig();
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// Local-only, explicitly opt-in Firebase Emulator connection — mirrors the
// pattern already proven safe in the Owner Console (Phase 07B). Never
// reachable in production: both the hostname check and the explicit query
// flag must hold.
const isLocalHost = ['localhost', '127.0.0.1'].includes(location.hostname);
if (isLocalHost && new URLSearchParams(location.search).get('useEmulators') === '1') {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
}
// PHASE 08.3 — local acceptance-only basemap fallback (see twin.html's
// identical comment). Production/Preview always render the configured real
// Street or Satellite raster tiles; this can only ever be true on localhost
// with an explicit extra query param, for a sandbox with no outbound tile
// access. Renders a neutral procedural background — never fabricated
// geographic imagery — so UI/interaction acceptance can proceed.
const useLocalBasemap = isLocalHost && new URLSearchParams(location.search).get('localBasemap') === '1';

// Light-first for daily municipal work; Night is an explicit, persisted
// control-room choice rather than an operating-system side effect.
const THEME_KEY = 'smartHsrGeoTheme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  const dark = theme === 'dark';
  btn.textContent = dark ? 'الوضع النهاري' : 'الوضع الليلي';
  btn.setAttribute('aria-label', dark ? 'تفعيل الوضع النهاري' : 'تفعيل الوضع الليلي');
}
applyTheme(localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light');
document.getElementById('themeToggleBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem(THEME_KEY, next);
  if (map) applyBasemapTheme();
});

const BASEMAP_KEY = 'smartHsrOperationalBasemap';
let activeBasemap = localStorage.getItem(BASEMAP_KEY) === 'satellite' ? 'satellite' : 'street';

// Same self-lookup role-resolution pattern already used independently by
// manager-operations.html/dashboard.html/mobile-map.html (each page reads
// its own record; the server independently re-derives the real
// authorization for every API call — this is UI branching only).
async function resolveCallerRole(uid) {
  const ownerSnap = await getDoc(doc(db, 'owners', uid));
  if (ownerSnap.exists() && ownerSnap.data().active !== false) return { role: 'owner', organizationId: null };
  const managerSnap = await getDoc(doc(db, 'managers', uid));
  if (managerSnap.exists()) {
    const d = managerSnap.data();
    if (d.role === 'manager' && d.active !== false && d.organizationId) return { role: 'manager', organizationId: d.organizationId };
  }
  const userSnap = await getDoc(doc(db, 'users', uid));
  if (userSnap.exists()) {
    const d = userSnap.data();
    if (['supervisor', 'inspector', 'contractor'].includes(d.role) && d.active !== false && d.organizationId) {
      return { role: d.role, organizationId: d.organizationId };
    }
  }
  return null;
}

async function apiGet(params) {
  const token = await auth.currentUser.getIdToken();
  const url = new URL('/api/organization/context', location.origin);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const res = await fetch(url.toString(), { headers: { Authorization: `Bearer ${token}` } });
  return { ok: res.ok, status: res.status, body: await res.json().catch(() => ({})) };
}

let map, caller, mapContext, loadedEntities = [], currentUser = null;
// UAT/dev-only introspection hooks — read-only, expose no PII beyond
// counts/coordinates already visible on the rendered map, and perform no
// write of any kind.
window.__geoDebugEntityCount = () => loadedEntities.length;
window.__geoDebugMap = () => map;
const activeLayers = new Set();
// Field observations are SMART HSR's own trusted municipal records — the
// GeoEntity produced by fromFieldObservation() (shared with twin.html)
// deliberately stays a generic geometry+status shape; this page-local map
// keeps the FULL real observation document alongside it, purely for
// presentation (popup/detail-panel fields), the same way manager.html's
// own map card reads directly from its real observation objects. Never a
// second continuity/entity contract — just real data for real UI text.
const rawObservationById = new Map();
let observationStatusFilter = 'ALL';
let observationCategoryFilter = 'ALL';
let observationPriorityFilter = 'ALL';

function labelFor(layerId) { return (layerRegistry.getLayer(layerId) || {}).labelAr || layerId; }

// Layers this specific page actually implements loading for. The registry
// also declares lands_parcels/mobility_missions/mobility_incidents (real
// future layers), but Lands parcels currently carry no geometry field at
// all and Mobility missions/incidents carry no coordinate field either
// (both confirmed in the Phase 08 map inventory) — there is nothing real
// to load for them yet. Showing a toggle for a layer with no real data to
// honestly show would be a dead control; the registry stays the source of
// truth for what a FUTURE loader should implement, this page just doesn't
// claim to load what it can't.
const IMPLEMENTED_LAYER_IDS = ['commercial_places', 'buildings', 'field_observations'];

const layerCounts = new Map();
let lastSnapshotAt = null;
function renderLayerToggles(organizationId) {
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  for (const layer of layerRegistry.layersForExperience('operational')) {
    if (!IMPLEMENTED_LAYER_IDS.includes(layer.id)) continue;
    const visible = layerRegistry.isLayerVisibleToRole(layer.id, caller.role).allowed;
    if (!visible) continue;
    const row = document.createElement('label');
    row.className = 'layer-row';
    row.innerHTML = `<input type="checkbox" data-layer="${layer.id}" ${layer.defaultVisible ? 'checked' : ''}><span>${layer.labelAr}</span><span class="layer-count" data-count="${layer.id}"></span>`;
    list.appendChild(row);
    if (layer.defaultVisible) activeLayers.add(layer.id);
  }
  list.querySelectorAll('input[type=checkbox]').forEach((cb) => {
    cb.addEventListener('change', () => {
      if (cb.checked) activeLayers.add(cb.dataset.layer); else activeLayers.delete(cb.dataset.layer);
      loadVisibleLayers(organizationId);
    });
  });
  updateLayerCounts();
}

function updateLayerCounts() {
  document.querySelectorAll('.layer-count').forEach((el) => {
    const layerId = el.dataset.count;
    el.textContent = activeLayers.has(layerId) ? String(layerCounts.get(layerId) || 0) : '';
  });
  updateMapSummary();
}

function updateMapSummary() {
  document.getElementById('visibleEntityCount').textContent = String(loadedEntities.length);
  document.getElementById('snapshotState').textContent = lastSnapshotAt
    ? `آخر تحميل ${lastSnapshotAt.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}`
    : 'بيانات عند الطلب';
}

// STABILIZATION — bbox-scoped layers (commercial_places/buildings) used to
// re-fetch AND fully tear down/rebuild their GL source+layers on every
// single 'moveend', even a few-pixel pan: confirmed empirically (8 small
// pan nudges -> 8 network requests + 8 removeLayer/addLayer/removeSource/
// addSource cycles, with the layer visibly absent from the map for over a
// second between removal and re-add on each one). Root cause of the
// reported flashing/pulsing and request-storm symptoms.
//
// Fix: fetch a BUFFERED bbox (viewport expanded by VIEWPORT_PREFETCH_BUFFER
// in every direction) and cache which bounds were last fetched per layer.
// A pan/zoom that stays within the already-fetched buffered area never
// re-fetches or repaints at all; one that doesn't is fetched with the same
// buffer, so a few more small pans afterward again need nothing.
const VIEWPORT_PREFETCH_BUFFER = 0.5;
const bboxLayerCache = {
  commercial_places: { bounds: null, entities: [], attributions: [] },
  buildings: { bounds: null, entities: [], attributions: [] },
};
function bufferedBoundsAndParam() {
  const b = map.getBounds();
  const w = b.getEast() - b.getWest(), h = b.getNorth() - b.getSouth();
  const bufX = w * VIEWPORT_PREFETCH_BUFFER, bufY = h * VIEWPORT_PREFETCH_BUFFER;
  const bounds = { west: b.getWest() - bufX, south: b.getSouth() - bufY, east: b.getEast() + bufX, north: b.getNorth() + bufY };
  return { bounds, param: [bounds.west, bounds.south, bounds.east, bounds.north].join(',') };
}
function viewportCoveredBy(bounds) {
  if (!bounds) return false;
  const b = map.getBounds();
  return b.getWest() >= bounds.west && b.getEast() <= bounds.east && b.getSouth() >= bounds.south && b.getNorth() <= bounds.north;
}

// Field observations are SMART HSR's own trusted municipal data (already
// real, tenant-scoped Firestore documents) — unlike commercial_places and
// buildings, they are read directly from Firestore here (a one-shot query,
// re-run whenever layers/viewport change) using the SAME tenant-safe
// observationCoordinates() helper spatial-map.js's existing Leaflet map
// surfaces already rely on, never a second, drifting coordinate-resolution
// implementation. This is a snapshot fetch, not a live onSnapshot listener
// — never described as "live"/"مباشر" anywhere in this UI (see the Phase 08
// brief's REALTIME DEFINITION rule).
// Fetches ALL admissible observations for the org (unfiltered by
// status/category/priority) — those filters are applied client-side by
// applyObservationFilters() below over this same cached set, so toggling a
// filter never re-runs this Firestore read (Section 18).
async function loadFieldObservations(organizationId) {
  const snap = await getDocs(query(collection(db, 'observations'), where('organizationId', '==', organizationId)));
  lastSnapshotAt = new Date();
  const { entity: entityModule } = window.SmartHSRGeoCore;
  const entities = [];
  rawObservationById.clear();
  snap.forEach((docSnap) => {
    const data = { id: docSnap.id, ...docSnap.data() };
    const coords = observationCoordinates(data, organizationId);
    if (!coords) return;
    const { decision, entity } = entityModule.fromFieldObservation(data, coords);
    if (!decision.allowed) return;
    rawObservationById.set(entity.id, data);
    entities.push(entity);
  });
  return entities;
}

// Status/category/priority filters all apply here, over the already-cached
// full observation set — never a second Firestore read per filter change.
// Category/priority use the same real field shapes as the entity-card/popup
// (data.type, data.riskAssessment.priority) — never a second, drifting
// notion of what these fields mean.
function applyObservationFilters(entities) {
  return entities.filter((e) => {
    const data = rawObservationById.get(e.id);
    if (!data) return false;
    if (observationStatusFilter !== 'ALL' && (data.status || 'PENDING') !== observationStatusFilter) return false;
    if (observationCategoryFilter !== 'ALL' && data.type !== observationCategoryFilter) return false;
    if (observationPriorityFilter !== 'ALL') {
      const priority = data.riskAssessment && typeof data.riskAssessment.priority === 'string' ? data.riskAssessment.priority.toUpperCase() : null;
      if (priority !== observationPriorityFilter) return false;
    }
    return true;
  });
}

// Field observations are read straight from Firestore (org-scoped, not
// bbox-scoped — there is no server-side geo query for them), so re-running
// that read on every map pan/zoom would be a real, needless Firestore-read
// cost with no corresponding visual change. `includeObservations:false`
// (used by the moveend handler below) re-fetches only the bbox-scoped
// commercial_places/buildings layers and repaints the already-loaded
// observation entities from cache — never a stale layer, never a wasted
// re-fetch (Section 18).
let cachedObservationEntities = [];
// STABILIZATION — monotonic generation counter so a slow API response from
// an OLDER viewport/call can never overwrite state painted by a NEWER one
// (a real race under rapid panning/zooming/layer-toggling, since this
// function is async and was never guarded against overlapping in-flight
// calls). Every await below re-checks this before touching shared state.
let viewportRequestGeneration = 0;
async function loadVisibleLayers(organizationId, { includeObservations = true } = {}) {
  const generation = ++viewportRequestGeneration;
  loadedEntities = [];
  for (const layerId of ['commercial_places', 'buildings']) {
    const cache = bboxLayerCache[layerId];
    if (!activeLayers.has(layerId)) { removeSourceLayer(layerId); cache.bounds = null; cache.entities = []; continue; }
    if (!viewportCoveredBy(cache.bounds)) {
      const { bounds, param } = bufferedBoundsAndParam();
      const res = await apiGet({ organizationId, geoLayer: layerId, bbox: param });
      if (generation !== viewportRequestGeneration) return; // superseded by a newer call — discard this stale response
      if (res.ok) {
        cache.bounds = bounds;
        cache.entities = res.body.entities;
        cache.attributions = res.body.attributions;
        paintEntities(layerId, cache.entities);
        renderAttribution(cache.attributions);
      }
    }
    loadedEntities.push(...cache.entities);
    layerCounts.set(layerId, cache.entities.length);
  }
  if (!activeLayers.has('field_observations')) {
    removeObservationSource();
    cachedObservationEntities = [];
  } else if (includeObservations) {
    cachedObservationEntities = await loadFieldObservations(organizationId);
    if (generation !== viewportRequestGeneration) return; // superseded — discard
    const filtered = applyObservationFilters(cachedObservationEntities);
    layerCounts.set('field_observations', filtered.length);
    paintObservations(filtered);
    renderFilterChips();
  }
  loadedEntities.push(...applyObservationFilters(cachedObservationEntities));
  updateLayerCounts();
}

// Reused verbatim from platform/geo/geo-style-tokens.js — never a second,
// drifting copy of what a status color means (Section 16).
const STATUS_COLOR = styleTokens.DATA_STATUS;
const STATUS_LABEL = { PENDING: 'قيد الانتظار', IN_PROGRESS: 'قيد المعالجة', PENDING_REVIEW: 'قيد المراجعة', COMPLETED: 'مكتمل' };
const PRIORITY_LABEL = { LOW: 'منخفضة', MEDIUM: 'متوسطة', HIGH: 'عالية', CRITICAL: 'حرجة' };
const CATEGORY_LABEL = { MAINTENANCE: 'صيانة', QUALITY: 'جودة', SAFETY: 'سلامة', ENVIRONMENT: 'بيئة', ROAD: 'طرق' };

let selectedEntityId = null;
let activePopup = null;
const OBS_SRC = 'geo-field_observations';

// removeSourceLayer()+addSource() runs on every repaint (every filter
// change, every bbox-scoped moveend for commercial_places/buildings), but
// a MapLibre layer-id string is stable across those repaints — binding a
// NEW map.on('click', layerId, ...) listener each time silently
// accumulated one stale listener per repaint (Section 18). Each layer id
// is bound exactly once; MapLibre still resolves clicks against whichever
// features are currently rendered under that id.
const boundClickLayers = new Set();
function bindClickOnce(layerId, handler) {
  if (boundClickLayers.has(layerId)) return;
  boundClickLayers.add(layerId);
  map.on('click', layerId, handler);
}

// Five-tier severity scale — same colors as the panel's legend rows below
// (منخفض/متوسط/مرتفع/حرج/لا بيانات), driven by the real
// riskAssessment.priority field (never fabricated). Individual pins stay
// STATUS-colored (Section 16's existing, already-proven status semantics —
// PENDING/IN_PROGRESS/COMPLETED, unchanged from prior stages); clusters use
// the real aggregated max-severity of their real children, a genuinely
// different, complementary signal a premium command map is expected to
// show (Section 04's "severity/status-aware treatment" for clusters).
const SEVERITY_COLOR = { '-1': '#64748b', 0: '#22c55e', 1: '#f5a524', 2: '#fb7185', 3: '#ef4444' };
const SEVERITY_RANK = { LOW: 0, MEDIUM: 1, HIGH: 2, CRITICAL: 3 };
function severityRankOf(data) {
  const raw = data.riskAssessment && typeof data.riskAssessment.priority === 'string' ? data.riskAssessment.priority.toUpperCase() : null;
  return raw && raw in SEVERITY_RANK ? SEVERITY_RANK[raw] : -1;
}

// Real MapLibre GL clustering (supercluster) still computes every grouping
// and every count — this source carries NO style layers at all and is used
// purely as the clustering/query engine (MapLibre's own documented "HTML
// marker" clustering pattern: https://maplibre.org/maplibre-gl-js/docs/examples/cluster-html/).
// A GL `circle`+`symbol` layer pair cannot show a real numeric cluster
// count without an external glyphs/font server (see the removed
// paintEntities() comment for the identical constraint) — rendering each
// cluster/point as a real DOM element instead removes that constraint while
// preserving accessible, clearly labelled pins. This is presentation-only:
// no clustering math is reimplemented here; it remains MapLibre/supercluster.
const observationMarkers = new Map();
function clearObservationMarkers() {
  observationMarkers.forEach((m) => m.remove());
  observationMarkers.clear();
}

function buildObservationPinElement(feature) {
  const status = feature.properties.status || 'PENDING';
  const color = STATUS_COLOR[status] || STATUS_COLOR.NEUTRAL;
  const el = document.createElement('div');
  el.className = 'geo-marker';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `بلاغ ميداني — ${STATUS_LABEL[status] || status}`);
  el.innerHTML = `<svg width="30" height="38" viewBox="0 0 30 38" aria-hidden="true">
    <path d="M15 37C15 37 3 22.7 3 14.6C3 7.7 8.7 2 15 2C21.3 2 27 7.7 27 14.6C27 22.7 15 37 15 37Z" fill="${color}" stroke="#fff" stroke-width="2"/>
    <circle cx="15" cy="14.6" r="5.4" fill="#fff"/>
  </svg>`;
  const activate = (evt) => { evt.stopPropagation(); selectObservation(feature.properties.id, feature.geometry.coordinates); };
  el.addEventListener('click', activate);
  el.addEventListener('keydown', (evt) => { if (evt.key === 'Enter' || evt.key === ' ') activate(evt); });
  return el;
}

function buildObservationClusterElement(feature) {
  const count = feature.properties.point_count_abbreviated || feature.properties.point_count;
  const severity = typeof feature.properties.severityMax === 'number' ? feature.properties.severityMax : -1;
  const color = SEVERITY_COLOR[String(severity)] || SEVERITY_COLOR['-1'];
  const size = Math.min(52, 34 + Math.min(feature.properties.point_count, 50) / 3);
  const el = document.createElement('div');
  el.className = 'geo-cluster';
  el.style.width = `${size}px`; el.style.height = `${size}px`;
  el.style.background = color;
  el.style.setProperty('--cluster-ring', `${color}30`);
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `تجميع ${count} بلاغ — عرض/تكبير`);
  el.textContent = String(count);
  const clusterId = feature.properties.cluster_id;
  // MapLibre's queried feature object is only valid synchronously — capture
  // the coordinates into a local now, never re-read `feature` inside the
  // .then() below (the earlier GL-layer-click version of this code hit
  // exactly that staleness bug; a DOM click handler's own closure is safe
  // here, but the same discipline is kept for clarity and consistency).
  const center = feature.geometry.coordinates;
  const expand = (evt) => {
    evt.stopPropagation();
    // MapLibre GL 4.x's GeoJSONSource#getClusterExpansionZoom returns a
    // Promise (the old Mapbox-GL-style (clusterId, callback) signature was
    // removed) — a callback argument here would be silently ignored.
    map.getSource(OBS_SRC).getClusterExpansionZoom(clusterId)
      .then((zoom) => map.easeTo({ center, zoom }))
      .catch(() => {});
  };
  el.addEventListener('click', expand);
  el.addEventListener('keydown', (evt) => { if (evt.key === 'Enter' || evt.key === ' ') expand(evt); });
  return el;
}

// Called on every camera stop and every real data/filter change — never on
// every animation frame (Section 18): once created, a maplibregl.Marker
// repositions itself on the map's own render loop, so existing markers only
// need a coordinate refresh here, not a full DOM rebuild.
function syncObservationMarkers() {
  if (!map.getSource(OBS_SRC)) { clearObservationMarkers(); return; }
  const features = map.querySourceFeatures(OBS_SRC);
  const seen = new Set();
  for (const feature of features) {
    const isCluster = !!feature.properties.cluster;
    const key = isCluster ? `c:${feature.properties.cluster_id}` : `p:${feature.properties.id}`;
    if (seen.has(key)) continue; // supercluster can repeat a feature across internal tile boundaries
    seen.add(key);
    let marker = observationMarkers.get(key);
    if (!marker) {
      const el = isCluster ? buildObservationClusterElement(feature) : buildObservationPinElement(feature);
      if (!isCluster && feature.properties.id === selectedEntityId) el.classList.add('selected');
      marker = new maplibregl.Marker({ element: el, anchor: isCluster ? 'center' : 'bottom' })
        .setLngLat(feature.geometry.coordinates)
        .addTo(map);
      observationMarkers.set(key, marker);
    } else {
      marker.setLngLat(feature.geometry.coordinates);
    }
  }
  for (const [key, marker] of observationMarkers) {
    if (!seen.has(key)) { marker.remove(); observationMarkers.delete(key); }
  }
}

const OBS_DRIVER_LAYER = `${OBS_SRC}-driver`;
function removeObservationSource() {
  clearObservationMarkers();
  if (map.getLayer(OBS_DRIVER_LAYER)) map.removeLayer(OBS_DRIVER_LAYER);
  if (map.getSource(OBS_SRC)) map.removeSource(OBS_SRC);
}
function paintObservations(entities) {
  removeObservationSource();
  const geojson = {
    type: 'FeatureCollection',
    features: entities.map((e) => {
      const data = rawObservationById.get(e.id) || {};
      return { type: 'Feature', id: e.id, geometry: e.geometry, properties: { id: e.id, status: e.status || 'PENDING', severityRank: severityRankOf(data) } };
    }),
  };
  map.addSource(OBS_SRC, {
    type: 'geojson', data: geojson, cluster: entities.length > 0, clusterRadius: 50, clusterMaxZoom: 14,
    // Real aggregation over real children — never a fabricated/guessed
    // cluster severity (Section 04).
    clusterProperties: { severityMax: ['max', ['get', 'severityRank']] },
  });
  // A source with zero consuming style layers is never tiled/clustered by
  // MapLibre at all (querySourceFeatures/getClusterExpansionZoom silently
  // return nothing — confirmed empirically) — this fully invisible circle
  // layer exists ONLY to keep the real supercluster engine engaged; every
  // pixel actually seen is the DOM marker/cluster badge built below.
  map.addLayer({ id: OBS_DRIVER_LAYER, type: 'circle', source: OBS_SRC, paint: { 'circle-opacity': 0, 'circle-radius': 0 } });
  syncObservationMarkers();
}

// Incremental DOM class toggle (Section 18 — never rebuilds the
// source/markers just to move which pin looks selected).
function markObservationSelected(entityId) {
  const previous = selectedEntityId;
  selectedEntityId = entityId;
  if (previous) observationMarkers.get(`p:${previous}`)?.getElement().classList.remove('selected');
  if (entityId) observationMarkers.get(`p:${entityId}`)?.getElement().classList.add('selected');
}

function selectObservation(entityId, lngLat) {
  markObservationSelected(entityId);
  openObservationPopup(entityId, lngLat);
}

function removeSourceLayer(layerId) {
  const srcId = `geo-${layerId}`;
  if (map.getLayer(`${srcId}-fill`)) map.removeLayer(`${srcId}-fill`);
  if (map.getLayer(`${srcId}-circles`)) map.removeLayer(`${srcId}-circles`);
  if (map.getLayer(`${srcId}-clusters`)) map.removeLayer(`${srcId}-clusters`);
  if (map.getLayer(`${srcId}-count`)) map.removeLayer(`${srcId}-count`);
  if (map.getSource(srcId)) map.removeSource(srcId);
}

// STABILIZATION — tracks whether the currently-painted source for a given
// layer id is in its "point/clustered" shape or its "polygon/fill" shape,
// so paintEntities() below can tell whether the existing source can just be
// updated with setData() (same shape, only the data changed — the common
// case on every pan/zoom) or genuinely needs a rebuild (shape changed, or
// painted for the first time). Removing and re-adding a GL source/layer
// pair on every single repaint was the confirmed root cause of the
// buildings/commercial_places layer visibly flashing on every pan.
const paintedLayerShape = new Map();
function paintEntities(layerId, entities) {
  const srcId = `geo-${layerId}`;
  const geojson = { type: 'FeatureCollection', features: entities.map((e) => ({ type: 'Feature', id: e.id, geometry: e.geometry, properties: { id: e.id, category: e.category, name: (e.metadata && e.metadata.name) || '' } })) };
  // PHASE 10 UAT FIX — an empty layer (a real, normal state: a newly
  // onboarded municipality with no reference geo data loaded yet for this
  // layer/bbox) left isPoint as `undefined` (entities[0] && ... short-
  // circuits to undefined, not false, when entities is empty), and MapLibre
  // rejects `cluster: undefined` outright ("boolean expected, undefined
  // found"), crashing this function before the layer's own (empty, correct)
  // source/layer pair ever got added. Coerced to a real boolean so an empty
  // layer renders as an empty layer instead of throwing.
  const isPoint = entities.length > 0 && entities[0].geometry.type === 'Point';
  const existingSource = map.getSource(srcId);
  if (existingSource && paintedLayerShape.get(srcId) === isPoint) {
    // Same shape already painted — update the real data in place. Click
    // handlers stay bound (bindClickOnce below never re-registers them
    // anyway), no layer is ever absent from the map even momentarily.
    existingSource.setData(geojson);
    return;
  }
  removeSourceLayer(layerId);
  paintedLayerShape.set(srcId, isPoint);
  map.addSource(srcId, { type: 'geojson', data: geojson, cluster: isPoint, clusterRadius: 40, clusterMaxZoom: 15 });
  const color = styleTokens.LAYER_STYLE[layerRegistry.getLayer(layerId).styleToken] || '#0EA5E9';
  if (isPoint) {
    // No cluster-count text label: a `symbol` layer's `text-field` requires
    // the map style to declare a `glyphs` (font) server, which would add an
    // external font-hosting dependency this phase does not need — cluster
    // size is still communicated visually via the circle-radius step below.
    map.addLayer({ id: `${srcId}-clusters`, type: 'circle', source: srcId, filter: ['has', 'point_count'],
      paint: { 'circle-color': color, 'circle-radius': ['step', ['get', 'point_count'], 14, 10, 18, 50, 24] } });
    map.addLayer({ id: `${srcId}-circles`, type: 'circle', source: srcId, filter: ['!', ['has', 'point_count']],
      paint: { 'circle-color': color, 'circle-radius': 7, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
    bindClickOnce(`${srcId}-circles`, (e) => openEntityCard(e.features[0].properties.id));
    bindClickOnce(`${srcId}-clusters`, (e) => {
      const clusterId = e.features[0].properties.cluster_id;
      // MapLibre's MapMouseEvent#features is only valid synchronously
      // during dispatch — read into a local before the async gap below
      // (see the identical note on the field_observations cluster handler
      // above); re-reading e.features inside .then() silently throws.
      const center = e.features[0].geometry.coordinates;
      // MapLibre GL 4.x's GeoJSONSource#getClusterExpansionZoom returns a
      // Promise (the old Mapbox-GL-style (clusterId, callback) signature
      // was removed) — this was a genuine, silent no-op defect (a callback
      // argument here is simply ignored) predating this stage; fixed here
      // as the same real cluster-expand behavior Section 10 requires.
      map.getSource(srcId).getClusterExpansionZoom(clusterId)
        .then((zoom) => map.easeTo({ center, zoom }))
        .catch(() => {});
    });
  } else {
    map.addLayer({ id: `${srcId}-fill`, type: 'fill', source: srcId, paint: { 'fill-color': color, 'fill-opacity': 0.35, 'fill-outline-color': color } });
    bindClickOnce(`${srcId}-fill`, (e) => openEntityCard(e.features[0].properties.id));
  }
}

function renderAttribution(attributions) {
  const el = document.getElementById('attributionNote');
  if (!attributions || !attributions.length) { el.textContent = ''; return; }
  el.textContent = attributions.map((a) => `${a.labelAr} · ${a.license}`).join(' — ');
}

function fieldRow(label, value) {
  return `<div class="field"><span class="label">${label}</span><span>${value}</span></div>`;
}
const NOT_LINKED = 'غير مربوط ببيانات البلدية';

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// Firestore Timestamp | {seconds} | millis-number — never a second date
// library, just the one real shape this codebase's own documents use.
function formatTimestamp(value) {
  const millis = value && typeof value.toMillis === 'function' ? value.toMillis()
    : (value && typeof value.seconds === 'number' ? value.seconds * 1000
    : (typeof value === 'number' ? value : null));
  if (!millis) return 'غير متاح';
  return new Date(millis).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' });
}

function openTwinContinuityUrl(entityId, coordinates) {
  return continuity.buildContinuityUrl('/twin.html' + location.search, {
    organizationId: mapContext.organizationId, entityId, camera: { center: coordinates, zoom: 17 },
  });
}

// Real, on-demand evidence resolution — reuses storage-adapter.js's
// resolveObservationImage unchanged, the exact same authenticated
// private-object-key path manager.html's own evidence viewer already uses.
// Never eager, never a fabricated placeholder image.
function resolveEntityEvidenceThumb(reference) {
  const el = document.getElementById('entityEvidenceThumb');
  if (!el) return;
  if (!reference) { el.textContent = 'لا تتوفر صورة موثّقة'; return; }
  resolveObservationImage({ reference, context: { organizationId: mapContext.organizationId, uid: currentUser.uid, role: caller.role, authUser: currentUser } })
    .then((result) => {
      const target = document.getElementById('entityEvidenceThumb');
      if (!target) return;

function openEntityCard(entityId) {

// Real reference-ID/title/inspector match against the raw observation
// documents this page already holds (rawObservationById) — the shared
// geo-search-contract.js provider stays generic (name/category/id only,
// shared with twin.html); this is page-local presentation search, exactly
// like manager.html's own local observation search, never a second
// continuity/entity contract.
function localObservationMatches(query) {
  const needle = query.trim().toLocaleLowerCase('ar');
  if (!needle) return [];
  const matches = [];
  for (const [entityId, data] of rawObservationById) {
    const haystack = [data.displayId, data.title, data.inspector, data.type].filter(Boolean).join(' ').toLocaleLowerCase('ar');
    if (haystack.includes(needle)) {
      matches.push({ entityId, label: data.title || data.displayId || 'بلاغ ميداني', kind: 'بلاغ ميداني' });
    }
  }
  return matches;
}

function focusSearchEntity(entityId) {
  const entity = loadedEntities.find((item) => item.id === entityId);
  const coordinates = entity && entity.geometry && entity.geometry.type === 'Point' ? entity.geometry.coordinates : entity && entity.centroid;
  if (coordinates) map.easeTo({ center: coordinates, zoom: Math.max(map.getZoom(), 15) });
  if (rawObservationById.has(entityId)) markObservationSelected(entityId);
  openEntityCard(entityId);
}

function closeSearchResults() {
  const box = document.getElementById('searchResults');
  box.classList.remove('open');
  document.getElementById('searchInput').setAttribute('aria-expanded', 'false');
}

function renderSearchResults(query) {
  const box = document.getElementById('searchResults');
  const needle = query.trim();
  if (needle.length < 2) { closeSearchResults(); box.innerHTML = ''; return; }
  const provider = searchModule.createLocalEntitySearchProvider();
  const { results } = provider.search(needle, { entities: loadedEntities, organization: mapContext });
  const combined = localObservationMatches(needle).concat(
    results.filter((result) => result.target && result.target.entityId)
      .map((result) => ({ entityId: result.target.entityId, label: result.label, kind: 'عنصر مكاني' }))
  );
  const unique = Array.from(new Map(combined.map((result) => [result.entityId, result])).values()).slice(0, 8);
  box.innerHTML = '';
  if (!unique.length) {
    box.innerHTML = '<div class="search-empty">لا توجد نتائج ضمن البيانات المعروضة حاليًا</div>';
  } else {
    for (const result of unique) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'search-result';
      button.setAttribute('role', 'option');
      button.innerHTML = `<strong>${escapeHtml(result.label)}</strong><br><span style="color:var(--text-muted);font-size:10.5px">${escapeHtml(result.kind)}</span>`;
      button.addEventListener('click', () => { closeSearchResults(); focusSearchEntity(result.entityId); });
      box.appendChild(button);
    }
  }
  box.classList.add('open');
  document.getElementById('searchInput').setAttribute('aria-expanded', 'true');
}

document.getElementById('searchInput').addEventListener('input', (e) => renderSearchResults(e.target.value));
document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearchResults(); });
document.addEventListener('click', (e) => { if (!e.target.closest('.search-shell')) closeSearchResults(); });

// Real "fit to data" / reset-extent toolbar control (Section 06) — MapLibre
// has no built-in one, so this is a small, standard custom control, never a
// decorative button.
class FitDataControl {
  onAdd(mapInstance) {
    this._map = mapInstance;
    this._container = document.createElement('div');
    this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'احتواء كل البيانات المعروضة');
    btn.title = 'احتواء كل البيانات المعروضة';
    btn.textContent = '⤢';
    btn.addEventListener('click', () => fitToLoadedData());
    this._container.appendChild(btn);
    return this._container;
  }
  onRemove() { this._container.parentNode && this._container.parentNode.removeChild(this._container); this._map = undefined; }
}

function fitToLoadedData() {
  const coords = loadedEntities.map((e) => (e.geometry && e.geometry.type === 'Point' ? e.geometry.coordinates : (e.centroid || null))).filter(Boolean);
  if (coords.length) {
    const lons = coords.map((c) => c[0]), lats = coords.map((c) => c[1]);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: 60, maxZoom: 16 });
  } else if (mapContext.mapCenter) {
    map.flyTo({ center: [mapContext.mapCenter.lng, mapContext.mapCenter.lat], zoom: mapContext.mapDefaultZoom || 13 });
  }
}

// Two honest 2D basemaps: a labeled street map for daily municipal work and
// satellite imagery for visual verification. Day/Night remains an independent
// presentation choice; switching basemap never recreates the MapLibre map or
// any operational source/layer.
const STREET_BASEMAP_LAYER_ID = 'street-basemap';
const SATELLITE_BASEMAP_LAYER_ID = 'satellite-basemap';
function realBasemapStyle() {
  return {
    version: 8,
    sources: {
      street: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap contributors',
      },
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: 'Esri, Maxar, Earthstar Geographics, and the GIS User Community',
      },
    },
    layers: [
      { id: STREET_BASEMAP_LAYER_ID, type: 'raster', source: 'street', layout: { visibility: activeBasemap === 'street' ? 'visible' : 'none' } },
      { id: SATELLITE_BASEMAP_LAYER_ID, type: 'raster', source: 'satellite', layout: { visibility: activeBasemap === 'satellite' ? 'visible' : 'none' } },
    ],
  };
}

// PHASE 08.3-style local acceptance-only fallback (see the useLocalBasemap
// comment above): this sandbox's egress proxy blocks every tile host, not
// just OpenStreetMap's (confirmed against Esri/CARTO too), by organization
// policy — not something a different provider choice can work around. This
// generates a small, honestly-labeled procedural texture (never claimed to
// be real imagery) purely so UI/interaction acceptance can proceed here;
// Production/Preview never take this path.
const SANDBOX_BASEMAP_LAYER_ID = 'sandbox-basemap';
function sandboxTerrainDataUrl() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#3d4a3f';
  ctx.fillRect(0, 0, size, size);
  let seed = 42;
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 46; i++) {
    const w = 8 + rand() * 28, h = 8 + rand() * 28, x = rand() * size, y = rand() * size;
    const shade = 44 + Math.floor(rand() * 34);
    ctx.fillStyle = `rgb(${shade + 22},${shade + 30},${shade + 20})`;
    ctx.fillRect(x, y, w, h);
  }
  return canvas.toDataURL('image/png');
}
function sandboxBasemapStyle() {
  return {
    version: 8,
    sources: { sandbox: { type: 'raster', tiles: [sandboxTerrainDataUrl()], tileSize: 256 } },
    layers: [{ id: SANDBOX_BASEMAP_LAYER_ID, type: 'raster', source: 'sandbox' }],
  };
}

function syncBasemapControl() {
  document.querySelectorAll('[data-basemap]').forEach((button) => {
    const selected = button.dataset.basemap === activeBasemap;
    button.classList.toggle('active', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
}

function selectBasemap(next) {
  if (!['street', 'satellite'].includes(next)) return;
  activeBasemap = next;
  localStorage.setItem(BASEMAP_KEY, next);
  syncBasemapControl();
  if (!map || useLocalBasemap) return;
  map.setLayoutProperty(STREET_BASEMAP_LAYER_ID, 'visibility', next === 'street' ? 'visible' : 'none');
  map.setLayoutProperty(SATELLITE_BASEMAP_LAYER_ID, 'visibility', next === 'satellite' ? 'visible' : 'none');
  applyBasemapTheme();
}

document.querySelectorAll('[data-basemap]').forEach((button) => {
  button.addEventListener('click', () => selectBasemap(button.dataset.basemap));
});
syncBasemapControl();
if (useLocalBasemap) document.getElementById('basemapControl').hidden = true;

// Mild, legibility-first Night treatment. There is deliberately no hue
// rotation or cinematic vignette: status colors and map labels remain stable.
function applyBasemapTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const layerIds = useLocalBasemap ? [SANDBOX_BASEMAP_LAYER_ID] : [STREET_BASEMAP_LAYER_ID, SATELLITE_BASEMAP_LAYER_ID];
  for (const layerId of layerIds) {
    if (!map.getLayer(layerId)) continue;
    const satellite = layerId === SATELLITE_BASEMAP_LAYER_ID;
    map.setPaintProperty(layerId, 'raster-brightness-max', dark ? (satellite ? 0.64 : 0.72) : 1);
    map.setPaintProperty(layerId, 'raster-brightness-min', dark ? 0.08 : 0);
    map.setPaintProperty(layerId, 'raster-contrast', dark ? 0.05 : 0);
    map.setPaintProperty(layerId, 'raster-saturation', dark ? -0.18 : 0);
    map.setPaintProperty(layerId, 'raster-hue-rotate', 0);
  }
}

// Real, non-fabricated municipal operational extent (Section 02): only
// rendered when the organization has a real admin-configured mapBounds
// rectangle (api/organization/context.js's own cleanBounds()) — no
// boundary is drawn when one hasn't been configured, ever.
function renderMunicipalBoundary(bounds) {
  if (!Array.isArray(bounds) || bounds.length !== 2) return;
  const [[swLat, swLng], [neLat, neLng]] = bounds;
  const ring = [[swLng, swLat], [neLng, swLat], [neLng, neLat], [swLng, neLat], [swLng, swLat]];
  const geojson = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: {} };
  if (map.getSource('geo-municipal-boundary')) { map.getSource('geo-municipal-boundary').setData(geojson); return; }
  map.addSource('geo-municipal-boundary', { type: 'geojson', data: geojson });
  // Calm cartographic boundary: one crisp line, no glow or decorative halo.
  map.addLayer({ id: 'geo-municipal-boundary-line', type: 'line', source: 'geo-municipal-boundary',
    paint: { 'line-color': '#0f7a50', 'line-width': 2, 'line-opacity': 0.9, 'line-dasharray': [3, 2] } });
}

const STATUS_FILTER_OPTIONS = [
  ['ALL', 'كل الحالات', null],
  ['PENDING', 'قيد الانتظار', STATUS_COLOR.PENDING],
  ['IN_PROGRESS', 'قيد المعالجة', STATUS_COLOR.IN_PROGRESS],
  ['COMPLETED', 'مكتمل', STATUS_COLOR.COMPLETED],
];
// Real per-status tally over the full cached (unfiltered) observation set —
// doubles as the panel's status legend (Section 09) and the filter control,
// never a decorative/random chip scattered on the map.
function statusTally() {
  const tally = { ALL: cachedObservationEntities.length, PENDING: 0, IN_PROGRESS: 0, COMPLETED: 0 };
  for (const e of cachedObservationEntities) {
    const data = rawObservationById.get(e.id);
    const status = (data && data.status) || 'PENDING';
    if (status in tally) tally[status] += 1;
  }
  return tally;
}
function renderFilterChips() {
  const container = document.getElementById('filterChips');
  container.innerHTML = '';
  const tally = statusTally();
  const list = document.createElement('div');
  list.className = 'geo-legend';
  for (const [value, label, color] of STATUS_FILTER_OPTIONS) {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'status-row' + (observationStatusFilter === value ? ' active' : '');
    row.setAttribute('aria-pressed', String(observationStatusFilter === value));
    row.setAttribute('aria-label', `تصفية البلاغات حسب الحالة: ${label}`);
    row.innerHTML = `${color ? `<span class="dot" style="background:${color}"></span>` : '<span style="width:8px"></span>'}<span>${escapeHtml(label)}</span><span class="count">${tally[value]}</span>`;
    row.addEventListener('click', () => { observationStatusFilter = value; renderFilterChips(); reapplyObservationFilters(); });
    list.appendChild(row);
  }
  container.appendChild(list);

  // Category and priority are real fields on field_observations documents
  // (data.type, data.riskAssessment.priority — the same shapes the popup
  // and detail panel already read) — filtered here purely client-side over
  // the already-cached full observation set, never a second Firestore read.
  const categorySelect = document.createElement('select');
  categorySelect.className = 'geo-filter-select';
  categorySelect.setAttribute('aria-label', 'تصفية البلاغات حسب التصنيف');
  categorySelect.innerHTML = ['<option value="ALL">كل التصنيفات</option>']
    .concat(Object.entries(CATEGORY_LABEL).map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`)).join('');
  categorySelect.value = observationCategoryFilter;
  categorySelect.addEventListener('change', (e) => { observationCategoryFilter = e.target.value; reapplyObservationFilters(); });
  container.appendChild(categorySelect);

  const prioritySelect = document.createElement('select');
  prioritySelect.className = 'geo-filter-select';
  prioritySelect.setAttribute('aria-label', 'تصفية البلاغات حسب الأولوية');
  prioritySelect.innerHTML = ['<option value="ALL">كل الأولويات</option>']
    .concat(Object.entries(PRIORITY_LABEL).map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`)).join('');
  prioritySelect.value = observationPriorityFilter;
  prioritySelect.addEventListener('change', (e) => { observationPriorityFilter = e.target.value; reapplyObservationFilters(); });
  container.appendChild(prioritySelect);
}

// Every filter (status/category/priority) applies client-side over the
// already-fetched full observation set — no filter change ever re-reads
// Firestore, and commercial_places/buildings are never touched (Section 18).
function reapplyObservationFilters() {
  if (!activeLayers.has('field_observations')) return;
  const filtered = applyObservationFilters(cachedObservationEntities);
  loadedEntities = loadedEntities.filter((e) => e.entityType !== 'field_observation').concat(filtered);
  layerCounts.set('field_observations', filtered.length);
  paintObservations(filtered);
  updateLayerCounts();
}

document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  observationStatusFilter = 'ALL';
  observationCategoryFilter = 'ALL';
  observationPriorityFilter = 'ALL';
  renderFilterChips();
  reapplyObservationFilters();
});

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'manager-login.html'; return; }
  // STABILIZATION — Firebase's onAuthStateChanged can legitimately re-fire
  // for an already-signed-in user (e.g. an ID token refresh), and nothing
  // here previously guarded against that: a second firing would construct
  // a SECOND maplibregl.Map on the same container, doubling every event
  // listener/render loop from then on. Sign-out already does a full
  // location.href navigation (see below), so the only way back into this
  // branch with `map` already set is a redundant re-fire for the same
  // session — never a legitimate user switch.
  if (map) return;
  currentUser = user;
  caller = await resolveCallerRole(user.uid);
  if (!caller) { await signOut(auth); location.href = 'manager-login.html'; return; }

  const contextRes = await apiGet(caller.organizationId ? { organizationId: caller.organizationId } : {});
  if (!contextRes.ok) return;
  mapContext = contextRes.body;

  document.getElementById('authLoading').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  // PHASE 08.1 CLOSURE 4: derive button visibility from the real, shared
  // Twin-admission policy (not a hand-maintained role list) so this can
  // never silently drift from geo-policy.js's fail-closed authority again.
  document.getElementById('openTwinBtn').hidden = !policy.evaluateTwinAdmission({ actor: caller }).allowed;
  // PHASE 08.3 — real-browser acceptance surfaced a genuine defect: the only
  // place this button's onclick was ever assigned was inside
  // openEntityCard() (below), gated on the button already being visible —
  // so clicking "Open in Twin" before selecting any entity did nothing at
  // all. Give it a real default destination (no entity context yet) here;
  // openEntityCard() still overrides this with entity-specific continuity
  // context once an entity is selected, unchanged.
  if (!document.getElementById('openTwinBtn').hidden) {
    document.getElementById('openTwinBtn').onclick = () => {
      const { url } = continuity.buildContinuityUrl('/twin.html' + location.search, { organizationId: mapContext.organizationId });
      if (url) location.href = url;
    };
  }

  map = new maplibregl.Map({
    container: 'map',
    style: useLocalBasemap ? sandboxBasemapStyle() : realBasemapStyle(),
    center: mapContext.mapCenter ? [mapContext.mapCenter.lng, mapContext.mapCenter.lat] : [45, 24],
    zoom: mapContext.mapDefaultZoom || 6,
  });
  // Compact left toolbar (Section 05/06) — zoom, fit/reset, fullscreen,
  // locate (real browser Geolocation API, never a fabricated position).
  map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-left');
  map.addControl(new FitDataControl(), 'top-left');
  map.addControl(new maplibregl.FullscreenControl(), 'top-left');
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: false }), 'top-left');
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
  map.addControl(new maplibregl.AttributionControl({ compact: true }));

  const continuityEncoded = new URL(location.href).searchParams.get(continuity.CONTINUITY_PARAM);
  if (continuityEncoded) {
    const { context } = continuity.decodeContinuityContext(continuityEncoded);
    if (context && context.camera) map.setCenter(context.camera.center), map.setZoom(context.camera.zoom);
  }

  map.on('load', () => {
    applyBasemapTheme();
    renderMunicipalBoundary(mapContext.mapBounds);
    renderLayerToggles(mapContext.organizationId);
    renderFilterChips();
    loadVisibleLayers(mapContext.organizationId);
  });
  // STABILIZATION — sync markers immediately (cheap: repositions existing
  // DOM markers, only creates/removes when clustering itself changed), but
  // debounce the bbox-layer reload: a real user rarely pans/zooms exactly
  // once and stops, and the buffer above already makes most individual
  // moveends free, but a burst of several moveends in a row (fast repeated
  // small drags, or a scroll-wheel zoom flurry) should still settle into
  // ONE reload, not one per event.
  let moveendReloadTimer = null;
  map.on('moveend', () => {
    syncObservationMarkers();
    clearTimeout(moveendReloadTimer);
    moveendReloadTimer = setTimeout(() => {
      loadVisibleLayers(mapContext.organizationId, { includeObservations: false });
    }, 200);
  });
  // A GeoJSON source's clustered tiles for a NEWLY-reached zoom level are
  // computed asynchronously — querySourceFeatures() called synchronously on
  // 'moveend' alone can still see the previous zoom's (stale/empty) tile
  // data. MapLibre's own documented HTML-marker-clustering pattern re-syncs
  // on 'sourcedata' for exactly this reason.
  map.on('sourcedata', (e) => { if (e.sourceId === OBS_SRC && e.isSourceLoaded) syncObservationMarkers(); });
});
</script>
